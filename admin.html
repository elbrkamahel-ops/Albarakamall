<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>إدارة مول البركة</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Tahoma,sans-serif;
    background:#f4f7f5;
    color:#18251e;
}

.header{
    background:#087f3f;
    color:white;
    padding:18px;
}

.header-inner{
    max-width:1200px;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
}

.logo{
    display:flex;
    align-items:center;
    gap:12px;
}

.logo-icon{
    width:48px;
    height:48px;
    background:white;
    color:#087f3f;
    border-radius:14px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:25px;
    font-weight:900;
}

.logo strong{
    display:block;
    font-size:18px;
}

.logo small{
    opacity:.8;
}

.back{
    background:white;
    color:#087f3f;
    text-decoration:none;
    padding:11px 17px;
    border-radius:10px;
    font-weight:bold;
}

.container{
    max-width:1200px;
    margin:25px auto;
    padding:0 15px;
}

.top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
    margin-bottom:20px;
}

.top h1{
    margin:0;
    font-size:25px;
}

.top p{
    margin:7px 0 0;
    color:#7c8981;
    font-size:12px;
}

.add{
    border:0;
    background:#087f3f;
    color:white;
    padding:13px 18px;
    border-radius:10px;
    font-weight:bold;
}

.card{
    background:white;
    border:1px solid #e0e8e3;
    border-radius:18px;
    padding:20px;
    margin-bottom:20px;
}

.form-title{
    font-size:18px;
    margin-bottom:18px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:14px;
}

.field{
    display:flex;
    flex-direction:column;
    gap:7px;
}

.field label{
    font-size:12px;
    font-weight:bold;
}

.field input,
.field select{
    width:100%;
    height:45px;
    border:1px solid #dbe5df;
    border-radius:10px;
    padding:0 12px;
    outline:none;
    font-size:13px;
    background:#fafcfb;
}

.field input:focus,
.field select:focus{
    border-color:#087f3f;
    background:white;
}

.full{
    grid-column:1/-1;
}

.check{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:13px;
    font-weight:bold;
}

.buttons{
    display:flex;
    gap:10px;
    margin-top:18px;
}

.save{
    border:0;
    background:#087f3f;
    color:white;
    padding:12px 25px;
    border-radius:10px;
    font-weight:bold;
}

.cancel{
    border:0;
    background:#edf1ee;
    padding:12px 20px;
    border-radius:10px;
    font-weight:bold;
}

.products{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:13px;
}

.product{
    border:1px solid #e1e8e3;
    border-radius:15px;
    overflow:hidden;
    background:white;
}

.product-top{
    height:125px;
    background:#f2f6f3;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:52px;
    position:relative;
}

.badge{
    position:absolute;
    top:8px;
    right:8px;
    background:#e84b3c;
    color:white;
    padding:5px 8px;
    border-radius:7px;
    font-size:10px;
}

.product-body{
    padding:12px;
}

.product-body h3{
    margin:0 0 7px;
    font-size:14px;
}

.info{
    color:#818d85;
    font-size:10px;
}

.price{
    color:#087f3f;
    font-size:17px;
    font-weight:900;
    margin-top:8px;
}

.actions{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:7px;
    margin-top:12px;
}

.edit,
.remove{
    border:0;
    padding:9px;
    border-radius:8px;
    font-weight:bold;
}

.edit{
    background:#edf8f1;
    color:#087f3f;
}

.remove{
    background:#fff0ef;
    color:#d44337;
}

.hidden{
    display:none;
}

.message{
    position:fixed;
    left:20px;
    bottom:20px;
    background:#087f3f;
    color:white;
    padding:13px 18px;
    border-radius:10px;
    font-size:12px;
    font-weight:bold;
    opacity:0;
    transform:translateY(15px);
    transition:.25s;
}

.message.show{
    opacity:1;
    transform:translateY(0);
}

.empty{
    grid-column:1/-1;
    text-align:center;
    padding:40px;
    color:#87938b;
}

@media(max-width:900px){
    .products{
        grid-template-columns:repeat(3,1fr);
    }
}

@media(max-width:650px){

    .header-inner,
    .top{
        flex-direction:column;
        align-items:stretch;
    }

    .grid{
        grid-template-columns:1fr;
    }

    .full{
        grid-column:auto;
    }

    .products{
        grid-template-columns:repeat(2,1fr);
    }

    .back,
    .add{
        text-align:center;
    }
}
</style>
</head>

<body>

<header class="header">

<div class="header-inner">

<div class="logo">

<div class="logo-icon">ب</div>

<div>
<strong>مول البركة أولاد الجارحي</strong>
<small>لوحة إدارة المنتجات</small>
</div>

</div>

<a class="back" href="index.html">
العودة للمتجر
</a>

</div>

</header>


<main class="container">

<div class="top">

<div>
<h1>إدارة المنتجات</h1>

<p>
إضافة المنتجات وتعديل الأسعار والأقسام
</p>
</div>

<button class="add" id="newProduct">
+ إضافة منتج
</button>

</div>


<section class="card hidden" id="editor">

<h2 class="form-title" id="editorTitle">
إضافة منتج جديد
</h2>

<form id="productForm">

<input type="hidden" id="productId">

<div class="grid">

<div class="field">

<label>اسم المنتج</label>

<input
id="name"
type="text"
placeholder="مثال: طماطم بلدي"
required
>

</div>


<div class="field">

<label>السعر</label>

<input
id="price"
type="number"
min="0"
step="0.01"
placeholder="20"
required
>

</div>


<div class="field">

<label>القسم</label>

<select id="category">

<option>خضروات</option>
<option>فواكه</option>
<option>لحوم</option>
<option>طيور</option>
<option>ماركت</option>
<option>عطارة</option>
<option>ألبان</option>
<option>مشروبات</option>
<option>منظفات</option>

</select>

</div>


<div class="field">

<label>الوحدة</label>

<select id="unit">

<option>كيلو</option>
<option>قطعة</option>
<option>عبوة</option>
<option>كرتونة</option>
<option>زجاجة</option>
<option>كيس</option>
<option>علبة</option>
<option>100 جرام</option>

</select>

</div>


<div class="field full">

<label>رابط صورة المنتج</label>

<input
id="image"
type="url"
placeholder="https://..."
>

</div>


<div class="field">

<label>رمز المنتج</label>

<input
id="emoji"
type="text"
placeholder="🍅"
maxlength="4"
>

</div>


<div class="field">

<label>الحالة</label>

<select id="active">

<option value="true">
متاح للبيع
</option>

<option value="false">
غير متاح
</option>

</select>

</div>


<div class="field full">

<label class="check">

<input
id="offer"
type="checkbox"
>

🔥 المنتج عرض

</label>

</div>

</div>


<div class="buttons">

<button
class="save"
type="submit"
>
حفظ المنتج
</button>

<button
class="cancel"
type="button"
id="cancel"
>
إلغاء
</button>

</div>

</form>

</section>


<section class="card">

<h2 class="form-title">
المنتجات
</h2>

<div
class="products"
id="products"
>
<div class="empty">
جاري تحميل المنتجات...
</div>
</div>

</section>

</main>


<div class="message" id="message"></div>


<script>

const PRODUCTS_URL = "products.json";

let products = [];

let editingId = null;


const editor =
document.getElementById("editor");

const form =
document.getElementById("productForm");

const list =
document.getElementById("products");


function message(text){

const box =
document.getElementById("message");

box.textContent = text;

box.classList.add("show");

setTimeout(()=>{
box.classList.remove("show");
},2500);

}


function escapeHTML(value){

return String(value ?? "")
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}


async function loadProducts(){

try{

const response =
await fetch(
PRODUCTS_URL + "?v=" + Date.now()
);

if(!response.ok){
throw new Error();
}

const data =
await response.json();

products =
Array.isArray(data.products)
? data.products
: [];

render();

}catch(error){

list.innerHTML = `
<div class="empty">
تعذر تحميل المنتجات.
<br><br>
تأكد من وجود products.json
</div>
`;

}

}


function render(){

if(!products.length){

list.innerHTML = `
<div class="empty">
لا توجد منتجات.
</div>
`;

return;

}


list.innerHTML =
products
.filter(product => product.active !== false)
.map(product => {

return `

<article class="product">

<div class="product-top">

${
product.image
?
`<img
src="${escapeHTML(product.image)}"
alt="${escapeHTML(product.name)}"
style="width:100%;height:100%;object-fit:cover"
>`
:
escapeHTML(product.emoji || "🛒")
}

${
product.offer
?
`<span class="badge">🔥 عرض</span>`
:
""
}

</div>


<div class="product-body">

<h3>
${escapeHTML(product.name)}
</h3>

<div class="info">
${escapeHTML(product.category)}
 •
 ${escapeHTML(product.unit)}
</div>

<div class="price">
${Number(product.price).toLocaleString("ar-EG")}
 جنيه
</div>


<div class="actions">

<button
class="edit"
onclick="editProduct('${escapeHTML(product.id)}')"
>
✏️ تعديل
</button>

<button
class="remove"
onclick="deleteProduct('${escapeHTML(product.id)}')"
>
🗑️ حذف
</button>

</div>

</div>

</article>

`;

}).join("");

}


function openEditor(product=null){

editor.classList.remove("hidden");

if(product){

editingId =
product.id;

document.getElementById("editorTitle")
.textContent =
"تعديل المنتج";

document.getElementById("productId")
.value =
product.id;

document.getElementById("name")
.value =
product.name || "";

document.getElementById("price")
.value =
product.price || "";

document.getElementById("category")
.value =
product.category || "خضروات";

document.getElementById("unit")
.value =
product.unit || "كيلو";

document.getElementById("image")
.value =
product.image || "";

document.getElementById("emoji")
.value =
product.emoji || "🛒";

document.getElementById("active")
.value =
product.active === false
? "false"
: "true";

document.getElementById("offer")
.checked =
product.offer === true;

}else{

editingId = null;

document.getElementById("editorTitle")
.textContent =
"إضافة منتج جديد";

form.reset();

document.getElementById("emoji")
.value = "🛒";

document.getElementById("active")
.value = "true";

}

editor.scrollIntoView({
behavior:"smooth"
});

}


function editProduct(id){

const product =
products.find(
item =>
String(item.id) === String(id)
);

if(product){

openEditor(product);

}

}


function deleteProduct(id){

const product =
products.find(
item =>
String(item.id) === String(id)
);

if(!product){
return;
}


const ok =
confirm(
"هل تريد حذف " +
product.name +
"؟"
);

if(!ok){
return;
}


/*
|--------------------------------------------------------------------------
| مهم
|--------------------------------------------------------------------------
| الحذف الحقيقي من GitHub سيتم في الخطوة التالية
| عن طريق GitHub Actions.
|--------------------------------------------------------------------------
*/

message(
"تم تحديد المنتج للحذف. سنربطه بالحفظ على GitHub في الخطوة التالية."
);

}


document
.getElementById("newProduct")
.addEventListener(
"click",
()=>{
openEditor();
}
);


document
.getElementById("cancel")
.addEventListener(
"click",
()=>{
editor.classList.add("hidden");
editingId = null;
}
);


form.addEventListener(
"submit",
function(event){

event.preventDefault();


const product = {

id:
editingId ||
"p-" +
Date.now(),

name:
document.getElementById("name")
.value.trim(),

price:
Number(
document.getElementById("price")
.value
),

category:
document.getElementById("category")
.value,

unit:
document.getElementById("unit")
.value,

image:
document.getElementById("image")
.value.trim(),

emoji:
document.getElementById("emoji")
.value.trim() || "🛒",

offer:
document.getElementById("offer")
.checked,

active:
document.getElementById("active")
.value === "true"

};


if(!product.name){

message("اكتب اسم المنتج");

return;

}


if(
!Number.isFinite(product.price) ||
product.price < 0
){

message("أدخل سعرًا صحيحًا");

return;

}


/*
|--------------------------------------------------------------------------
| هنا لن نستخدم localStorage
|--------------------------------------------------------------------------
| البيانات سترسل إلى GitHub Actions في الخطوة التالية.
|--------------------------------------------------------------------------
*/

console.log(
"PRODUCT_TO_SAVE",
product
);

message(
"البيانات جاهزة للحفظ على GitHub"
);

});


loadProducts();

</script>

</body>
</html>
