<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>لوحة تحكم مول البركة</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0
}

body{
    font-family:Tahoma,Arial,sans-serif;
    background:#f4f7f5;
    color:#17221c
}

.header{
    background:#087f3f;
    color:white;
    padding:18px;
    box-shadow:0 4px 20px rgba(0,0,0,.12)
}

.header-inner{
    max-width:1400px;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px
}

.logo{
    font-size:24px;
    font-weight:900
}

.logo small{
    font-size:13px;
    opacity:.9
}

.header-actions{
    display:flex;
    gap:8px;
    flex-wrap:wrap
}

button{
    font-family:inherit
}

.header-btn{
    border:0;
    background:white;
    color:#087f3f;
    padding:11px 16px;
    border-radius:12px;
    font-weight:900;
    cursor:pointer
}

.layout{
    max-width:1400px;
    margin:auto;
    padding:20px
}

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
    margin-bottom:20px
}

.stat{
    background:white;
    padding:20px;
    border-radius:18px;
    box-shadow:0 5px 20px rgba(0,0,0,.06)
}

.stat-icon{
    font-size:30px
}

.stat-title{
    color:#68756d;
    margin-top:6px
}

.stat-number{
    color:#087f3f;
    font-size:30px;
    font-weight:900;
    margin-top:5px
}

.toolbar{
    background:white;
    padding:15px;
    border-radius:18px;
    margin-bottom:18px;
    box-shadow:0 5px 20px rgba(0,0,0,.06)
}

.toolbar-row{
    display:flex;
    gap:10px;
    flex-wrap:wrap
}

.search,
.select{
    border:1px solid #d6ded9;
    border-radius:12px;
    padding:13px;
    font-size:15px;
    outline:none
}

.search{
    flex:1;
    min-width:220px
}

.select{
    min-width:180px;
    background:white
}

.search:focus,
.select:focus,
input:focus{
    border-color:#087f3f
}

.primary,
.secondary{
    border:0;
    border-radius:12px;
    padding:13px 18px;
    font-weight:900;
    cursor:pointer
}

.primary{
    background:#087f3f;
    color:white
}

.secondary{
    background:#eaf3ed;
    color:#087f3f
}

.products-box{
    background:white;
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 5px 20px rgba(0,0,0,.06)
}

.products-header{
    padding:18px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-bottom:1px solid #edf0ee
}

.table-wrap{
    overflow-x:auto
}

table{
    width:100%;
    min-width:900px;
    border-collapse:collapse
}

th{
    background:#f7faf8;
    padding:15px;
    text-align:right;
    color:#59665e
}

td{
    padding:14px;
    border-top:1px solid #edf0ee
}

.product-cell{
    display:flex;
    align-items:center;
    gap:10px
}

.product-image{
    width:55px;
    height:55px;
    border-radius:12px;
    background:#f0f4f1;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    font-size:28px
}

.product-image img{
    width:100%;
    height:100%;
    object-fit:cover
}

.product-name{
    font-weight:900
}

.product-id{
    font-size:12px;
    color:#8a958e;
    margin-top:4px
}

.price{
    color:#087f3f;
    font-weight:900
}

.badge{
    display:inline-block;
    padding:6px 10px;
    border-radius:20px;
    font-size:12px;
    font-weight:900
}

.active{
    background:#dcf5e6;
    color:#087f3f
}

.inactive{
    background:#ffe4e4;
    color:#c62828
}

.actions{
    display:flex;
    gap:6px;
    flex-wrap:wrap
}

.action{
    border:0;
    border-radius:9px;
    padding:8px 10px;
    cursor:pointer;
    font-weight:800
}

.edit{
    background:#e8f1ff;
    color:#1261a0
}

.toggle{
    background:#fff1d5;
    color:#986000
}

.delete{
    background:#ffe6e6;
    color:#c62828
}

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.55);
    display:none;
    align-items:center;
    justify-content:center;
    padding:15px;
    z-index:9999
}

.modal.show{
    display:flex
}

.modal-box{
    width:100%;
    max-width:650px;
    max-height:94vh;
    overflow:auto;
    background:white;
    border-radius:22px;
    padding:22px
}

.modal-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:20px
}

.modal-head h2{
    color:#087f3f
}

.close{
    width:40px;
    height:40px;
    border:0;
    border-radius:50%;
    background:#f0f2f1;
    font-size:22px;
    cursor:pointer
}

.form-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:14px
}

.field{
    display:flex;
    flex-direction:column;
    gap:7px
}

.full{
    grid-column:1/-1
}

.field label{
    font-weight:800
}

.field input,
.field select{
    padding:13px;
    border:1px solid #d6ded9;
    border-radius:11px;
    font-size:15px;
    outline:none
}

.checks{
    display:flex;
    gap:20px;
    flex-wrap:wrap
}

.check{
    display:flex;
    align-items:center;
    gap:7px;
    font-weight:800
}

.modal-footer{
    display:flex;
    gap:10px;
    margin-top:20px
}

.modal-footer button{
    flex:1
}

.empty{
    padding:60px 20px;
    text-align:center;
    color:#78837d
}

.empty-icon{
    font-size:55px;
    margin-bottom:10px
}

.toast{
    position:fixed;
    bottom:20px;
    left:20px;
    z-index:99999;
    background:#087f3f;
    color:white;
    padding:14px 20px;
    border-radius:13px;
    box-shadow:0 10px 30px rgba(0,0,0,.2);
    opacity:0;
    transform:translateY(20px);
    transition:.25s
}

.toast.show{
    opacity:1;
    transform:translateY(0)
}

@media(max-width:850px){

    .stats{
        grid-template-columns:repeat(2,1fr)
    }

}

@media(max-width:600px){

    .header-inner{
        flex-direction:column;
        align-items:stretch
    }

    .header-actions{
        display:grid;
        grid-template-columns:1fr 1fr
    }

    .header-btn{
        width:100%
    }

    .layout{
        padding:12px
    }

    .stats{
        gap:10px
    }

    .stat{
        padding:14px
    }

    .stat-number{
        font-size:24px
    }

    .toolbar-row{
        flex-direction:column
    }

    .search,
    .select,
    .primary,
    .secondary{
        width:100%
    }

    .form-grid{
        grid-template-columns:1fr
    }

    .full{
        grid-column:auto
    }

    .modal-box{
        padding:16px
    }
}
</style>
</head>

<body>

<header class="header">

<div class="header-inner">

<div class="logo">
🛒 مول البركة
<br>
<small>لوحة إدارة المنتجات والأسعار</small>
</div>

<div class="header-actions">

<button
class="header-btn"
onclick="location.href='../index.html'">
🏪 المتجر
</button>

<button
class="header-btn"
onclick="downloadJSON()">
⬇️ تنزيل المنتجات
</button>

</div>

</div>

</header>


<main class="layout">

<section class="stats">

<div class="stat">
<div class="stat-icon">📦</div>
<div class="stat-title">كل المنتجات</div>
<div id="totalProducts" class="stat-number">0</div>
</div>

<div class="stat">
<div class="stat-icon">✅</div>
<div class="stat-title">منتجات نشطة</div>
<div id="activeProducts" class="stat-number">0</div>
</div>

<div class="stat">
<div class="stat-icon">⛔</div>
<div class="stat-title">متوقفة</div>
<div id="inactiveProducts" class="stat-number">0</div>
</div>

<div class="stat">
<div class="stat-icon">🏷️</div>
<div class="stat-title">الأقسام</div>
<div id="categoriesCount" class="stat-number">0</div>
</div>

</section>


<section class="toolbar">

<div class="toolbar-row">

<input
id="search"
class="search"
type="search"
placeholder="🔎 ابحث عن منتج أو كود..."
>

<select
id="category"
class="select">

<option value="الكل">
كل الأقسام
</option>

</select>

<button
class="primary"
onclick="openAdd()">
➕ إضافة منتج
</button>

</div>

</section>


<section class="products-box">

<div class="products-header">

<h2>
📦 المنتجات
</h2>

<strong id="resultCount">
0
</strong>

</div>


<div class="table-wrap">

<table>

<thead>

<tr>
<th>المنتج</th>
<th>القسم</th>
<th>السعر</th>
<th>الوحدة</th>
<th>الحالة</th>
<th>الإجراءات</th>
</tr>

</thead>

<tbody id="productsTable"></tbody>

</table>

</div>

</section>

</main>


<div
id="modal"
class="modal">

<div class="modal-box">

<div class="modal-head">

<h2 id="modalTitle">
إضافة منتج
</h2>

<button
class="close"
onclick="closeModal()">
×
</button>

</div>


<form id="productForm">

<input
type="hidden"
id="editIndex"
value="-1"
>

<div class="form-grid">


<div class="field">

<label>كود المنتج</label>

<input
id="id"
required
placeholder="veg001"
>

</div>


<div class="field">

<label>اسم المنتج</label>

<input
id="name"
required
placeholder="طماطم"
>

</div>


<div class="field">

<label>السعر بالجنيه</label>

<input
id="price"
type="number"
min="0"
step="0.01"
required
placeholder="25"
>

</div>


<div class="field">

<label>الوحدة</label>

<select id="unit">

<option>كيلو</option>
<option>قطعة</option>
<option>كرتونة</option>
<option>علبة</option>
<option>زجاجة</option>
<option>كيس</option>
<option>عبوة</option>
<option>رغيف</option>

</select>

</div>


<div class="field">

<label>القسم</label>

<input
id="productCategory"
required
placeholder="خضروات"
>

</div>


<div class="field">

<label>الإيموجي</label>

<input
id="emoji"
placeholder="🍅"
>

</div>


<div class="field full">

<label>رابط صورة المنتج</label>

<input
id="image"
placeholder="https://..."
>

</div>


<div class="field full">

<div class="checks">

<label class="check">

<input
id="offer"
type="checkbox"
>

🔥 عرض

</label>


<label class="check">

<input
id="active"
type="checkbox"
checked
>

✅ نشط

</label>

</div>

</div>

</div>


<div class="modal-footer">

<button
class="primary"
type="submit">

💾 حفظ المنتج

</button>

<button
class="secondary"
type="button"
onclick="closeModal()">

إلغاء

</button>

</div>

</form>

</div>

</div>


<div id="toast" class="toast"></div>


<script>

"use strict";


/*
=========================================================
إعدادات
=========================================================
*/

const PRODUCTS_FILE =
    "../products.json";

let products = [];


/*
=========================================================
أداة
=========================================================
*/

function $(id){
    return document.getElementById(id);
}


/*
=========================================================
رسالة
=========================================================
*/

function showToast(message){

    const toast =
        $("toast");

    toast.textContent =
        message;

    toast.classList.add("show");

    clearTimeout(
        toast.timer
    );

    toast.timer =
        setTimeout(
            function(){

                toast.classList.remove(
                    "show"
                );

            },
            2500
        );

}


/*
=========================================================
حماية HTML
=========================================================
*/

function escapeHTML(value){

    return String(
        value ?? ""
    )
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


/*
=========================================================
تحميل products.json
=========================================================
*/

async function loadProducts(){

    try{

        const response =
            await fetch(
                PRODUCTS_FILE +
                "?v=" +
                Date.now(),
                {
                    cache:"no-store"
                }
            );

        if(!response.ok){

            throw new Error(
                "products.json غير موجود"
            );

        }

        const data =
            await response.json();

        if(
            Array.isArray(data)
        ){

            products =
                data;

        }
        else if(
            Array.isArray(
                data.products
            )
        ){

            products =
                data.products;

        }
        else{

            products = [];

        }

        render();

    }
    catch(error){

        console.error(error);

        $("productsTable").innerHTML = `
            <tr>
                <td colspan="6">
                    <div class="empty">

                        <div class="empty-icon">
                            ⚠️
                        </div>

                        <h3>
                            لم يتم العثور على المنتجات
                        </h3>

                        <p>
                            تأكد من وجود
                            products.json
                            في المجلد الرئيسي.
                        </p>

                    </div>
                </td>
            </tr>
        `;

        showToast(
            "تعذر تحميل products.json"
        );

    }

}


/*
=========================================================
الإحصائيات
=========================================================
*/

function updateStats(){

    const active =
        products.filter(
            p => p.active !== false
        ).length;

    const inactive =
        products.length -
        active;

    const categories =
        new Set(
            products
            .map(
                p => p.category
            )
            .filter(Boolean)
        );

    $("totalProducts")
        .textContent =
        products.length;

    $("activeProducts")
        .textContent =
        active;

    $("inactiveProducts")
        .textContent =
        inactive;

    $("categoriesCount")
        .textContent =
        categories.size;

}


/*
=========================================================
الأقسام
=========================================================
*/

function updateCategories(){

    const select =
        $("category");

    const selected =
        select.value;

    const categories =
        [
            ...new Set(
                products
                .map(
                    p => p.category
                )
                .filter(Boolean)
            )
        ]
        .sort();

    select.innerHTML =
        `
        <option value="الكل">
            كل الأقسام
        </option>
        `;

    categories.forEach(
        function(category){

            const option =
                document.createElement(
                    "option"
                );

            option.value =
                category;

            option.textContent =
                category;

            select.appendChild(
                option
            );

        }
    );

    if(
        categories.includes(
            selected
        )
    ){

        select.value =
            selected;

    }

}


/*
=========================================================
عرض المنتجات
=========================================================
*/

function render(){

    updateStats();

    updateCategories();

    const search =
        $("search")
        .value
        .trim()
        .toLowerCase();

    const category =
        $("category")
        .value;


    const list =
        products.filter(
            function(product){

                const text =
                    (
                        product.id || ""
                    ) +
                    " " +
                    (
                        product.name || ""
                    ) +
                    " " +
                    (
                        product.category || ""
                    );

                const matchesSearch =
                    !search ||
                    text
                    .toLowerCase()
                    .includes(
                        search
                    );

                const matchesCategory =
                    category === "الكل" ||
                    product.category === category;

                return (
                    matchesSearch &&
                    matchesCategory
                );

            }
        );


    $("resultCount")
        .textContent =
        list.length +
        " منتج";


    const table =
        $("productsTable");


    if(!list.length){

        table.innerHTML = `
            <tr>
                <td colspan="6">
                    <div class="empty">
                        <div class="empty-icon">
                            📦
                        </div>
                        <h3>
                            لا توجد منتجات
                        </h3>
                    </div>
                </td>
            </tr>
        `;

        return;

    }


    table.innerHTML =
        list.map(
            function(product){

                const index =
                    products.indexOf(
                        product
                    );

                const active =
                    product.active !== false;

                const picture =
                    product.image
                    ?
                    `
                    <img
                        src="${escapeHTML(product.image)}"
                        alt=""
                        onerror="this.style.display='none'"
                    >
                    `
                    :
                    escapeHTML(
                        product.emoji ||
                        "🛒"
                    );


                return `
                <tr>

                    <td>

                        <div class="product-cell">

                            <div class="product-image">
                                ${picture}
                            </div>

                            <div>

                                <div class="product-name">
                                    ${escapeHTML(
                                        product.name ||
                                        "بدون اسم"
                                    )}
                                </div>

                                <div class="product-id">
                                    ${escapeHTML(
                                        product.id ||
                                        ""
                                    )}
                                </div>

                            </div>

                        </div>

                    </td>


                    <td>
                        ${escapeHTML(
                            product.category ||
                            "-"
                        )}
                    </td>


                    <td>

                        <span class="price">

                            ${Number(
                                product.price || 0
                            ).toLocaleString(
                                "ar-EG"
                            )}

                            جنيه

                        </span>

                    </td>


                    <td>
                        ${escapeHTML(
                            product.unit ||
                            "قطعة"
                        )}
                    </td>


                    <td>

                        <span class="badge ${
                            active
                            ? "active"
                            : "inactive"
                        }">

                            ${
                                active
                                ? "نشط"
                                : "متوقف"
                            }

                        </span>

                    </td>


                    <td>

                        <div class="actions">

                            <button
                                class="action edit"
                                onclick="editProduct(${index})">

                                ✏️ تعديل

                            </button>


                            <button
                                class="action toggle"
                                onclick="toggleProduct(${index})">

                                ${
                                    active
                                    ? "⛔ إيقاف"
                                    : "✅ تشغيل"
                                }

                            </button>


                            <button
                                class="action delete"
                                onclick="deleteProduct(${index})">

                                🗑️ حذف

                            </button>

                        </div>

                    </td>

                </tr>
                `;

            }
        )
        .join("");

}


/*
=========================================================
فتح إضافة
=========================================================
*/

function openAdd(){

    $("productForm").reset();

    $("editIndex")
        .value =
        "-1";

    $("modalTitle")
        .textContent =
        "إضافة منتج";

    $("active")
        .checked =
        true;

    $("emoji")
        .value =
        "🛒";

    $("unit")
        .value =
        "كيلو";

    $("modal")
        .classList
        .add("show");

}


/*
=========================================================
تعديل
=========================================================
*/

function editProduct(index){

    const product =
        products[index];

    if(!product)
        return;


    $("editIndex")
        .value =
        index;

    $("id")
        .value =
        product.id || "";

    $("name")
        .value =
        product.name || "";

    $("price")
        .value =
        product.price || 0;

    $("unit")
        .value =
        product.unit || "قطعة";

    $("productCategory")
        .value =
        product.category || "";

    $("emoji")
        .value =
        product.emoji || "🛒";

    $("image")
        .value =
        product.image || "";

    $("offer")
        .checked =
        Boolean(
            product.offer
        );

    $("active")
        .checked =
        product.active !== false;

    $("modalTitle")
        .textContent =
        "تعديل المنتج";

    $("modal")
        .classList
        .add("show");

}


/*
=========================================================
حفظ
=========================================================
*/

$("productForm")
.addEventListener(
    "submit",
    function(event){

        event.preventDefault();


        const index =
            Number(
                $("editIndex")
                .value
            );


        const product = {

            id:
                $("id")
                .value
                .trim(),

            name:
                $("name")
                .value
                .trim(),

            price:
                Number(
                    $("price")
                    .value
                ),

            unit:
                $("unit")
                .value,

            category:
                $("productCategory")
                .value
                .trim(),

            emoji:
                $("emoji")
                .value
                .trim() ||
                "🛒",

            image:
                $("image")
                .value
                .trim(),

            offer:
                $("offer")
                .checked,

            active:
                $("active")
                .checked

        };


        if(
            !product.id ||
            !product.name ||
            !product.category
        ){

            showToast(
                "أكمل بيانات المنتج"
            );

            return;

        }


        const duplicate =
            products.findIndex(
                function(item,i){

                    return (
                        i !== index &&
                        String(item.id) ===
                        String(product.id)
                    );

                }
            );


        if(
            duplicate !== -1
        ){

            showToast(
                "كود المنتج مستخدم بالفعل"
            );

            return;

        }


        if(index === -1){

            products.push(
                product
            );

            showToast(
                "تمت إضافة المنتج"
            );

        }
        else{

            products[index] =
                product;

            showToast(
                "تم تعديل المنتج"
            );

        }


        closeModal();

        render();


        /*
        =====================================================
        مهم
        =====================================================

        التعديل الآن موجود في الصفحة الحالية.

        اضغط "تنزيل المنتجات"
        لتحصل على products.json الجديد
        وترفعه إلى GitHub.

        لن نضع GitHub Token هنا.
        =====================================================
        */

    }
);


/*
=========================================================
تفعيل / إيقاف
=========================================================
*/

function toggleProduct(index){

    if(!products[index])
        return;

    products[index].active =
        products[index].active === false;

    render();

    showToast(
        products[index].active
        ? "تم تشغيل المنتج"
        : "تم إيقاف المنتج"
    );

}


/*
=========================================================
حذف
=========================================================
*/

function deleteProduct(index){

    const product =
        products[index];

    if(!product)
        return;


    if(
        !confirm(
            "هل تريد حذف:\n\n" +
            product.name +
            "\n\n؟"
        )
    ){

        return;

    }


    products.splice(
        index,
        1
    );


    render();

    showToast(
        "تم حذف المنتج"
    );

}


/*
=========================================================
إغلاق
=========================================================
*/

function closeModal(){

    $("modal")
        .classList
        .remove("show");

}


/*
=========================================================
تنزيل products.json
=========================================================
*/

function downloadJSON(){

    const data = {

        products:
            products

    };


    const json =
        JSON.stringify(
            data,
            null,
            2
        );


    const blob =
        new Blob(
            [json],
            {
                type:
                    "application/json;charset=utf-8"
            }
        );


    const url =
        URL.createObjectURL(
            blob
        );


    const link =
        document.createElement(
            "a"
        );

    link.href =
        url;

    link.download =
        "products.json";

    document.body.appendChild(
        link
    );

    link.click();

    link.remove();

    URL.revokeObjectURL(
        url
    );


    showToast(
        "تم تنزيل products.json"
    );

}


/*
=========================================================
بحث
=========================================================
*/

$("search")
.addEventListener(
    "input",
    render
);


/*
=========================================================
الأقسام
=========================================================
*/

$("category")
.addEventListener(
    "change",
    render
);


/*
=========================================================
إغلاق النافذة
=========================================================
*/

$("modal")
.addEventListener(
    "click",
    function(event){

        if(
            event.target ===
            this
        ){

            closeModal();

        }

    }
);


/*
=========================================================
بدء الصفحة
=========================================================
*/

loadProducts();
