<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>لوحة تحكم مول البركة</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:
        Tahoma,
        Arial,
        sans-serif;
    background:#f4f7f5;
    color:#17221c;
}

/* ================= HEADER ================= */

.header{
    background:#087f3f;
    color:#fff;
    padding:18px 20px;
    position:sticky;
    top:0;
    z-index:1000;
    box-shadow:0 4px 20px rgba(0,0,0,.12);
}

.header-inner{
    max-width:1400px;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
}

.logo{
    font-size:24px;
    font-weight:900;
}

.logo span{
    color:#ffd447;
}

.header-actions{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
}

.header-btn{
    border:0;
    background:#fff;
    color:#087f3f;
    padding:10px 15px;
    border-radius:12px;
    font-weight:800;
    cursor:pointer;
}

/* ================= LAYOUT ================= */

.layout{
    max-width:1400px;
    margin:auto;
    padding:20px;
}

.dashboard{
    display:grid;
    grid-template-columns:
        repeat(4,1fr);
    gap:15px;
    margin-bottom:20px;
}

.stat{
    background:#fff;
    border-radius:18px;
    padding:20px;
    box-shadow:
        0 5px 20px rgba(0,0,0,.06);
}

.stat-icon{
    font-size:30px;
}

.stat-title{
    color:#66736b;
    margin-top:8px;
}

.stat-number{
    font-size:30px;
    font-weight:900;
    color:#087f3f;
    margin-top:5px;
}

/* ================= TOOLBAR ================= */

.toolbar{
    background:#fff;
    border-radius:18px;
    padding:15px;
    margin-bottom:18px;
    box-shadow:
        0 5px 20px rgba(0,0,0,.06);
}

.toolbar-row{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

.search{
    flex:1;
    min-width:220px;
    border:1px solid #d8dfda;
    border-radius:12px;
    padding:13px;
    font-size:16px;
    outline:none;
}

.search:focus{
    border-color:#087f3f;
}

.select{
    border:1px solid #d8dfda;
    border-radius:12px;
    padding:13px;
    background:#fff;
    min-width:180px;
}

.primary{
    background:#087f3f;
    color:#fff;
    border:0;
    border-radius:12px;
    padding:13px 20px;
    font-weight:900;
    cursor:pointer;
}

.secondary{
    background:#eef4f0;
    color:#087f3f;
    border:0;
    border-radius:12px;
    padding:13px 18px;
    font-weight:900;
    cursor:pointer;
}

/* ================= PRODUCTS ================= */

.products-box{
    background:#fff;
    border-radius:18px;
    box-shadow:
        0 5px 20px rgba(0,0,0,.06);
    overflow:hidden;
}

.products-header{
    padding:18px;
    border-bottom:1px solid #edf0ee;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
}

.products-header h2{
    font-size:21px;
}

.table-wrap{
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:850px;
}

th{
    background:#f7faf8;
    color:#536158;
    font-size:14px;
    padding:15px;
    text-align:right;
}

td{
    padding:14px;
    border-top:1px solid #edf0ee;
    vertical-align:middle;
}

.product-cell{
    display:flex;
    align-items:center;
    gap:10px;
}

.product-image{
    width:55px;
    height:55px;
    border-radius:12px;
    background:#f1f5f2;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    font-size:30px;
}

.product-image img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.product-name{
    font-weight:900;
}

.product-id{
    font-size:12px;
    color:#89958e;
    margin-top:4px;
}

.price{
    font-weight:900;
    color:#087f3f;
}

.badge{
    display:inline-block;
    padding:6px 10px;
    border-radius:20px;
    font-size:12px;
    font-weight:900;
}

.badge.active{
    background:#dff6e8;
    color:#087f3f;
}

.badge.off{
    background:#ffe5e5;
    color:#c62828;
}

.actions{
    display:flex;
    gap:6px;
}

.action{
    border:0;
    border-radius:9px;
    padding:8px 11px;
    cursor:pointer;
    font-weight:800;
}

.edit{
    background:#e8f1ff;
    color:#1261a0;
}

.delete{
    background:#ffe7e7;
    color:#c62828;
}

.toggle{
    background:#fff3d7;
    color:#a66a00;
}

/* ================= MODAL ================= */

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.55);
    display:none;
    align-items:center;
    justify-content:center;
    padding:15px;
    z-index:5000;
}

.modal.show{
    display:flex;
}

.modal-box{
    background:#fff;
    width:100%;
    max-width:650px;
    max-height:92vh;
    overflow:auto;
    border-radius:22px;
    padding:22px;
}

.modal-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:20px;
}

.modal-head h2{
    color:#087f3f;
}

.close{
    width:40px;
    height:40px;
    border:0;
    border-radius:50%;
    background:#f1f3f2;
    font-size:20px;
    cursor:pointer;
}

.form-grid{
    display:grid;
    grid-template-columns:
        repeat(2,1fr);
    gap:14px;
}

.field{
    display:flex;
    flex-direction:column;
    gap:7px;
}

.field.full{
    grid-column:1/-1;
}

.field label{
    font-weight:800;
}

.field input,
.field select{
    width:100%;
    padding:13px;
    border:1px solid #d6ddd8;
    border-radius:11px;
    font-size:15px;
    outline:none;
}

.field input:focus,
.field select:focus{
    border-color:#087f3f;
}

.check-row{
    display:flex;
    gap:20px;
    flex-wrap:wrap;
    margin-top:5px;
}

.check{
    display:flex;
    align-items:center;
    gap:7px;
    font-weight:800;
}

.modal-footer{
    display:flex;
    gap:10px;
    margin-top:20px;
}

.modal-footer button{
    flex:1;
}

/* ================= EMPTY ================= */

.empty{
    padding:60px 20px;
    text-align:center;
    color:#78837d;
}

.empty-icon{
    font-size:55px;
    margin-bottom:10px;
}

/* ================= TOAST ================= */

.toast{
    position:fixed;
    left:20px;
    bottom:20px;
    background:#087f3f;
    color:#fff;
    padding:14px 20px;
    border-radius:13px;
    box-shadow:0 10px 30px rgba(0,0,0,.2);
    z-index:99999;
    opacity:0;
    transform:translateY(20px);
    transition:.25s;
    font-weight:800;
}

.toast.show{
    opacity:1;
    transform:translateY(0);
}

/* ================= MOBILE ================= */

@media(max-width:900px){

    .dashboard{
        grid-template-columns:
            repeat(2,1fr);
    }

}

@media(max-width:600px){

    .header{
        padding:14px;
    }

    .header-inner{
        align-items:flex-start;
        flex-direction:column;
    }

    .layout{
        padding:12px;
    }

    .dashboard{
        grid-template-columns:
            repeat(2,1fr);
        gap:10px;
    }

    .stat{
        padding:15px;
    }

    .stat-number{
        font-size:24px;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    .field.full{
        grid-column:auto;
    }

    .modal-box{
        padding:17px;
    }

    .toolbar-row{
        flex-direction:column;
    }

    .search,
    .select,
    .primary,
    .secondary{
        width:100%;
    }
}
</style>
</head>

<body>

<!-- ================= HEADER ================= -->

<header class="header">

<div class="header-inner">

<div class="logo">
🛒 <span>مول البركة</span>
<br>
<small>لوحة التحكم</small>
</div>

<div class="header-actions">

<button
class="header-btn"
onclick="window.location.href='../index.html'">
🏪 المتجر
</button>

<button
class="header-btn"
onclick="exportProducts()">
⬇️ تصدير المنتجات
</button>

</div>

</div>

</header>


<main class="layout">

<!-- ================= STATS ================= -->

<section class="dashboard">

<div class="stat">
<div class="stat-icon">📦</div>
<div class="stat-title">إجمالي المنتجات</div>
<div
class="stat-number"
id="totalProducts">
0
</div>
</div>

<div class="stat">
<div class="stat-icon">✅</div>
<div class="stat-title">منتجات نشطة</div>
<div
class="stat-number"
id="activeProducts">
0
</div>
</div>

<div class="stat">
<div class="stat-icon">⛔</div>
<div class="stat-title">منتجات متوقفة</div>
<div
class="stat-number"
id="inactiveProducts">
0
</div>
</div>

<div class="stat">
<div class="stat-icon">🏷️</div>
<div class="stat-title">الأقسام</div>
<div
class="stat-number"
id="totalCategories">
0
</div>
</div>

</section>


<!-- ================= TOOLBAR ================= -->

<section class="toolbar">

<div class="toolbar-row">

<input
id="search"
class="search"
type="search"
placeholder="🔎 ابحث باسم المنتج أو الكود..."
>

<select
id="categoryFilter"
class="select">

<option value="الكل">
كل الأقسام
</option>

</select>

<button
class="primary"
onclick="openAddModal()">

➕ إضافة منتج

</button>

<button
class="secondary"
onclick="document.getElementById('fileInput').click()">

📂 استيراد JSON

</button>

<input
id="fileInput"
type="file"
accept=".json,application/json"
style="display:none"
>

</div>

</section>


<!-- ================= PRODUCTS ================= -->

<section class="products-box">

<div class="products-header">

<h2>
📦 إدارة المنتجات
</h2>

<span id="resultCount">
0 منتج
</span>

</div>

<div class="table-wrap">

<table>

<thead>

<tr>

<th>المنتج</th>

<th>القسم</th>

<th>السعر</th>

<th>الوحدة</th>

<th>الحالة</th>

<th>الإجراءات</th>

</tr>

</thead>

<tbody id="productsTable">

</tbody>

</table>

</div>

</section>

</main>


<!-- ================= MODAL ================= -->

<div
class="modal"
id="productModal">

<div class="modal-box">

<div class="modal-head">

<h2 id="modalTitle">
إضافة منتج
</h2>

<button
class="close"
onclick="closeModal()">
×
</button>

</div>


<form id="productForm">

<input
type="hidden"
id="editIndex"
value="-1"
>

<div class="form-grid">


<div class="field">

<label>
كود المنتج
</label>

<input
id="productId"
required
placeholder="مثال: p1001"
>

</div>


<div class="field">

<label>
اسم المنتج
</label>

<input
id="productName"
required
placeholder="مثال: طماطم"
>

</div>


<div class="field">

<label>
السعر
</label>

<input
id="productPrice"
type="number"
min="0"
step="0.01"
required
placeholder="35"
>

</div>


<div class="field">

<label>
الوحدة
</label>

<select id="productUnit">

<option value="كيلو">
كيلو
</option>

<option value="قطعة">
قطعة
</option>

<option value="كرتونة">
كرتونة
</option>

<option value="علبة">
علبة
</option>

<option value="زجاجة">
زجاجة
</option>

<option value="كيس">
كيس
</option>

<option value="عبوة">
عبوة
</option>

<option value="رغيف">
رغيف
</option>

</select>

</div>


<div class="field">

<label>
القسم
</label>

<input
id="productCategory"
required
placeholder="خضروات"
>

</div>


<div class="field">

<label>
الإيموجي
</label>

<input
id="productEmoji"
placeholder="🍅"
>

</div>


<div class="field full">

<label>
رابط صورة المنتج
</label>

<input
id="productImage"
placeholder="https://..."
>

</div>


<div class="field full">

<div class="check-row">

<label class="check">

<input
id="productOffer"
type="checkbox"
>

🔥 عرض

</label>


<label class="check">

<input
id="productActive"
type="checkbox"
checked
>

✅ المنتج نشط

</label>

</div>

</div>

</div>


<div class="modal-footer">

<button
type="submit"
class="primary">

💾 حفظ المنتج

</button>

<button
type="button"
class="secondary"
onclick="closeModal()">

إلغاء

</button>

</div>

</form>

</div>

</div>


<div
id="toast"
class="toast">
تم
</div>


<script>

/* =========================================================
   مول البركة
   ADMIN PANEL
   ========================================================= */

"use strict";


const PRODUCTS_FILE = "../products.json";

let products = [];

let filteredProducts = [];


/* =========================================================
   عناصر الصفحة
   ========================================================= */

const $ = id =>
    document.getElementById(id);


/* =========================================================
   رسالة
   ========================================================= */

function toast(message){

    const element =
        $("toast");

    element.textContent =
        message;

    element.classList.add("show");

    clearTimeout(
        element.timer
    );

    element.timer =
        setTimeout(
            () => {
                element.classList.remove("show");
            },
            2500
        );
}


/* =========================================================
   تحميل المنتجات
   ========================================================= */

async function loadProducts(){

    try{

        const response =
            await fetch(
                PRODUCTS_FILE +
                "?v=" +
                Date.now(),
                {
                    cache:"no-store"
                }
            );

        if(!response.ok){

            throw new Error(
                "products.json غير موجود"
            );

        }

        const data =
            await response.json();

        if(
            Array.isArray(data)
        ){

            products =
                data;

        }
        else if(
            Array.isArray(data.products)
        ){

            products =
                data.products;

        }
        else{

            products = [];

        }

        renderAll();

    }
    catch(error){

        console.error(error);

        $("productsTable").innerHTML = `
            <tr>
                <td colspan="6">
                    <div class="empty">

                        <div class="empty-icon">
                            ⚠️
                        </div>

                        <h3>
                            تعذر تحميل المنتجات
                        </h3>

                        <p>
                            تأكد أن products.json
                            موجود في المجلد الرئيسي للموقع.
                        </p>

                    </div>
                </td>
            </tr>
        `;

        toast(
            "تعذر تحميل products.json"
        );

    }

}


/* =========================================================
   Escape
   ========================================================= */

function escapeHTML(value){

    return String(value ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}


/* =========================================================
   عرض الكل
   ========================================================= */

function renderAll(){

    updateStats();

    updateCategories();

    applyFilters();

}


/* =========================================================
   الإحصائيات
   ========================================================= */

function updateStats(){

    const active =
        products.filter(
            p => p.active !== false
        ).length;

    const inactive =
        products.length -
        active;

    const categories =
        new Set(
            products
                .map(p => p.category)
                .filter(Boolean)
        );

    $("totalProducts")
        .textContent =
        products.length;

    $("activeProducts")
        .textContent =
        active;

    $("inactiveProducts")
        .textContent =
        inactive;

    $("totalCategories")
        .textContent =
        categories.size;

}


/* =========================================================
   الأقسام
   ========================================================= */

function updateCategories(){

    const select =
        $("categoryFilter");

    const current =
        select.value;

    const categories =
        [
            ...new Set(
                products
                    .map(p => p.category)
                    .filter(Boolean)
            )
        ].sort();

    select.innerHTML = `
        <option value="الكل">
            كل الأقسام
        </option>
    `;

    categories.forEach(
        category => {

            const option =
                document.createElement(
                    "option"
                );

            option.value =
                category;

            option.textContent =
                category;

            select.appendChild(
                option
            );

        }
    );

    if(
        categories.includes(current)
    ){

        select.value =
            current;

    }

}


/* =========================================================
   الفلترة
   ========================================================= */

function applyFilters(){

    const search =
        $("search")
            .value
            .trim()
            .toLowerCase();

    const category =
        $("categoryFilter")
            .value;

    filteredProducts =
        products.filter(
            product => {

                const text =
                    (
                        String(
                            product.name || ""
                        ) +
                        " " +
                        String(
                            product.id || ""
                        ) +
                        " " +
                        String(
                            product.category || ""
                        )
                    )
                    .toLowerCase();

                const matchSearch =
                    !search ||
                    text.includes(search);

                const matchCategory =
                    category === "الكل" ||
                    product.category === category;

                return (
                    matchSearch &&
                    matchCategory
                );

            }
        );

    renderTable();

}


/* =========================================================
   جدول المنتجات
   ========================================================= */

function renderTable(){

    const table =
        $("productsTable");

    $("resultCount")
        .textContent =
        filteredProducts.length +
        " منتج";

    if(!filteredProducts.length){

        table.innerHTML = `
            <tr>
                <td colspan="6">

                    <div class="empty">

                        <div class="empty-icon">
                            📦
                        </div>

                        <h3>
                            لا توجد منتجات
                        </h3>

                    </div>

                </td>
            </tr>
        `;

        return;

    }


    table.innerHTML =
        filteredProducts
            .map(
                (product) => {

                    const realIndex =
                        products.indexOf(
                            product
                        );

                    const image =
                        product.image
                            ? `
                                <img
                                    src="${escapeHTML(product.image)}"
                                    alt=""
                                    onerror="this.style.display='none'"
                                >
                              `
                            :
                              escapeHTML(
                                  product.emoji ||
                                  "🛒"
                              );

                    const active =
                        product.active !== false;

                    return `
                        <tr>

                            <td>

                                <div class="product-cell">

                                    <div class="product-image">
                                        ${image}
                                    </div>

                                    <div>

                                        <div class="product-name">
                                            ${escapeHTML(
                                                product.name ||
                                                "بدون اسم"
                                            )}
                                        </div>

                                        <div class="product-id">
                                            ${escapeHTML(
                                                product.id ||
                                                ""
                                            )}
                                        </div>

                                    </div>

                                </div>

                            </td>

                            <td>
                                ${escapeHTML(
                                    product.category ||
                                    "-"
                                )}
                            </td>

                            <td>

                                <span class="price">
                                    ${Number(
                                        product.price || 0
                                    ).toLocaleString(
                                        "ar-EG"
                                    )}
                                    جنيه
                                </span>

                            </td>

                            <td>
                                ${escapeHTML(
                                    product.unit ||
                                    "قطعة"
                                )}
                            </td>

                            <td>

                                <span class="badge ${
                                    active
                                        ? "active"
                                        : "off"
                                }">

                                    ${
                                        active
                                            ? "نشط"
                                            : "متوقف"
                                    }

                                </span>

                            </td>

                            <td>

                                <div class="actions">

                                    <button
                                        class="action edit"
                                        onclick="editProduct(${realIndex})">

                                        ✏️ تعديل

                                    </button>

                                    <button
                                        class="action toggle"
                                        onclick="toggleProduct(${realIndex})">

                                        ${
                                            active
                                                ? "⛔ إيقاف"
                                                : "✅ تشغيل"
                                        }

                                    </button>

                                    <button
                                        class="action delete"
                                        onclick="deleteProduct(${realIndex})">

                                        🗑️ حذف

                                    </button>

                                </div>

                            </td>

                        </tr>
                    `;

                }
            )
            .join("");

}


/* =========================================================
   فتح إضافة
   ========================================================= */

function openAddModal(){

    $("productForm").reset();

    $("editIndex").value =
        "-1";

    $("modalTitle")
        .textContent =
        "إضافة منتج";

    $("productActive")
        .checked =
        true;

    $("productEmoji")
        .value =
        "🛒";

    $("productUnit")
        .value =
        "كيلو";

    $("productModal")
        .classList
        .add("show");

}


/* =========================================================
   إغلاق
   ========================================================= */

function closeModal(){

    $("productModal")
        .classList
        .remove("show");

}


/* =========================================================
   تعديل
   ========================================================= */

function editProduct(index){

    const product =
        products[index];

    if(!product)
        return;

    $("editIndex")
        .value =
        String(index);

    $("productId")
        .value =
        product.id || "";

    $("productName")
        .value =
        product.name || "";

    $("productPrice")
        .value =
        product.price || 0;

    $("productUnit")
        .value =
        product.unit || "قطعة";

    $("productCategory")
        .value =
        product.category || "";

    $("productEmoji")
        .value =
        product.emoji || "🛒";

    $("productImage")
        .value =
        product.image || "";

    $("productOffer")
        .checked =
        Boolean(
            product.offer
        );

    $("productActive")
        .checked =
        product.active !== false;

    $("modalTitle")
        .textContent =
        "تعديل المنتج";

    $("productModal")
        .classList
        .add("show");

}


/* =========================================================
   حفظ
   ========================================================= */

$("productForm")
.addEventListener(
    "submit",
    function(event){

        event.preventDefault();

        const index =
            Number(
                $("editIndex").value
            );

        const product = {

            id:
                $("productId")
                    .value
                    .trim(),

            name:
                $("productName")
                    .value
                    .trim(),

            price:
                Number(
                    $("productPrice")
                        .value
                ),

            unit:
                $("productUnit")
                    .value,

            category:
                $("productCategory")
                    .value
                    .trim(),

            image:
                $("productImage")
                    .value
                    .trim(),

            emoji:
                $("productEmoji")
                    .value
                    .trim() ||
                "🛒",

            offer:
                $("productOffer")
                    .checked,

            active:
                $("productActive")
                    .checked

        };


        if(
            !product.id ||
            !product.name ||
            !product.category
        ){

            toast(
                "أكمل بيانات المنتج"
            );

            return;

        }


        const duplicate =
            products.findIndex(
                (item,i) =>
                    i !== index &&
                    String(item.id) ===
                    String(product.id)
            );

        if(
            duplicate !== -1
        ){

            toast(
                "كود المنتج موجود بالفعل"
            );

            return;

        }


        if(index === -1){

            products.push(
                product
            );

            toast(
                "تمت إضافة المنتج"
            );

        }
        else{

            products[index] =
                product;

            toast(
                "تم تعديل المنتج"
            );

        }


        closeModal();

        renderAll();

    }
);


/* =========================================================
   تشغيل / إيقاف
   ========================================================= */

function toggleProduct(index){

    if(!products[index])
        return;

    products[index].active =
        products[index].active === false;

    renderAll();

    toast(
        products[index].active
            ? "تم تشغيل المنتج"
            : "تم إيقاف المنتج"
    );

}


/* =========================================================
   حذف
   ========================================================= */

function deleteProduct(index){

    const product =
        products[index];

    if(!product)
        return;

    const confirmed =
        confirm(
            "هل تريد حذف المنتج:\n\n" +
            product.name +
            "\n\nلا يمكن التراجع عن الحذف داخل الصفحة."
        );

    if(!confirmed)
        return;

    products.splice(
        index,
        1
    );

    renderAll();

    toast(
        "تم حذف المنتج"
    );

}


/* =========================================================
   تصدير JSON
   ========================================================= */

function exportProducts(){

    const data = {

        categories:
            [
                ...new Set(
                    products
                        .map(
                            p => p.category
                        )
                        .filter(Boolean)
                )
            ],

        products:
            products

    };


    const json =
        JSON.stringify(
            data,
            null,
            2
        );


    const blob =
        new Blob(
            [json],
            {
                type:
                    "application/json;charset=utf-8"
            }
        );


    const url =
        URL.createObjectURL(
            blob
        );


    const link =
        document.createElement(
            "a"
        );

    link.href =
        url;

    link.download =
        "products.json";

    document.body.appendChild(
        link
    );

    link.click();

    link.remove();

    URL.revokeObjectURL(
        url
    );

    toast(
        "تم تجهيز products.json"
    );

}


/* =========================================================
   استيراد JSON
   ========================================================= */

$("fileInput")
.addEventListener(
    "change",
    function(){

        const file =
            this.files[0];

        if(!file)
            return;

        const reader =
            new FileReader();

        reader.onload =
            function(){

                try{

                    const data =
                        JSON.parse(
                            reader.result
                        );

                    const imported =
                        Array.isArray(data)
                            ? data
                            : data.products;

                    if(
                        !Array.isArray(
                            imported
                        )
                    ){

                        throw new Error(
                            "صيغة JSON غير صحيحة"
                        );

                    }

                    products =
                        imported;

                    renderAll();

                    toast(
                        "تم استيراد المنتجات"
                    );

                }
                catch(error){

                    toast(
                        "ملف JSON غير صحيح"
                    );

                }

            };

        reader.readAsText(
            file,
            "UTF-8"
        );

        this.value = "";

    }
);


/* =========================================================
   البحث
   ========================================================= */

$("search")
.addEventListener(
    "input",
    applyFilters
);


/* =========================================================
   القسم
   ========================================================= */

$("categoryFilter")
.addEventListener(
    "change",
    applyFilters
);


/* =========================================================
   إغلاق عند الضغط خارج النافذة
   ========================================================= */

$("productModal")
.addEventListener(
    "click",
    function(event){

        if(
            event.target ===
            this
        ){

            closeModal();

        }

    }
);


/* =========================================================
   تشغيل
   ========================================================= */

document.addEventListener(
    "DOMContentLoaded",
    loadProducts
);

</script>
