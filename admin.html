<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>لوحة تحكم مول البركة</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Tahoma,sans-serif;
    background:#f4f7f5;
    color:#17251d;
}

button,
input,
select{
    font-family:inherit;
}

button{
    cursor:pointer;
}

.header{
    background:#087f3f;
    color:#fff;
    padding:18px;
    position:sticky;
    top:0;
    z-index:100;
    box-shadow:0 4px 15px rgba(0,0,0,.12);
}

.header-inner{
    max-width:1200px;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
}

.logo{
    display:flex;
    align-items:center;
    gap:12px;
}

.logo-icon{
    width:48px;
    height:48px;
    background:#fff;
    color:#087f3f;
    border-radius:14px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:24px;
    font-weight:900;
}

.logo strong{
    display:block;
    font-size:18px;
}

.logo small{
    opacity:.8;
    font-size:10px;
}

.back{
    background:#fff;
    color:#087f3f;
    padding:11px 16px;
    border-radius:11px;
    text-decoration:none;
    font-weight:900;
    font-size:12px;
}

.container{
    max-width:1200px;
    margin:25px auto;
    padding:0 15px;
}

.title{
    margin-bottom:20px;
}

.title h1{
    font-size:27px;
}

.title p{
    color:#7d8982;
    margin-top:6px;
    font-size:12px;
}

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:13px;
    margin-bottom:20px;
}

.stat{
    background:#fff;
    border:1px solid #e1e9e4;
    border-radius:16px;
    padding:18px;
}

.stat span{
    color:#849088;
    display:block;
    font-size:11px;
    margin-bottom:8px;
}

.stat strong{
    color:#087f3f;
    font-size:25px;
}

.card{
    background:#fff;
    border:1px solid #e1e9e4;
    border-radius:18px;
    padding:20px;
    margin-bottom:20px;
}

.card-title{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-bottom:18px;
}

.card-title h2{
    font-size:18px;
}

.add-new{
    border:0;
    background:#087f3f;
    color:#fff;
    padding:12px 18px;
    border-radius:11px;
    font-weight:900;
}

.form-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:14px;
}

.field{
    display:flex;
    flex-direction:column;
    gap:7px;
}

.field.full{
    grid-column:1/-1;
}

.field label{
    font-size:11px;
    font-weight:900;
}

.field input,
.field select{
    height:45px;
    border:1px solid #dce6df;
    border-radius:10px;
    padding:0 12px;
    outline:none;
    background:#fafcfb;
}

.field input:focus,
.field select:focus{
    border-color:#087f3f;
    background:#fff;
}

.actions{
    display:flex;
    gap:8px;
    margin-top:15px;
}

.save{
    border:0;
    background:#087f3f;
    color:#fff;
    padding:12px 25px;
    border-radius:10px;
    font-weight:900;
}

.cancel{
    border:0;
    background:#edf1ee;
    color:#49564e;
    padding:12px 20px;
    border-radius:10px;
    font-weight:bold;
}

.products{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
}

.product{
    border:1px solid #e2e9e4;
    border-radius:15px;
    overflow:hidden;
    background:#fff;
}

.product-image{
    height:120px;
    background:#f3f7f4;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:55px;
    position:relative;
}

.offer{
    position:absolute;
    top:8px;
    right:8px;
    background:#e64c3c;
    color:#fff;
    padding:5px 8px;
    border-radius:6px;
    font-size:9px;
}

.product-body{
    padding:12px;
}

.product-body h3{
    font-size:13px;
    margin-bottom:6px;
}

.product-category{
    color:#8b968f;
    font-size:10px;
}

.price{
    color:#087f3f;
    font-weight:900;
    margin-top:8px;
}

.product-actions{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:7px;
    margin-top:12px;
}

.edit{
    border:0;
    background:#eef7f1;
    color:#087f3f;
    padding:9px;
    border-radius:8px;
    font-weight:900;
}

.delete{
    border:0;
    background:#fff0ef;
    color:#d34438;
    padding:9px;
    border-radius:8px;
    font-weight:900;
}

.empty{
    text-align:center;
    padding:40px;
    color:#89948e;
    grid-column:1/-1;
}

.toast{
    position:fixed;
    left:20px;
    bottom:20px;
    background:#087f3f;
    color:#fff;
    padding:13px 18px;
    border-radius:11px;
    font-size:12px;
    font-weight:bold;
    opacity:0;
    transform:translateY(20px);
    transition:.25s;
    z-index:999;
}

.toast.show{
    opacity:1;
    transform:translateY(0);
}

@media(max-width:900px){

    .products{
        grid-template-columns:repeat(3,1fr);
    }

    .stats{
        grid-template-columns:repeat(2,1fr);
    }

}

@media(max-width:600px){

    .header-inner{
        flex-direction:column;
        align-items:stretch;
    }

    .back{
        text-align:center;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    .field.full{
        grid-column:auto;
    }

    .products{
        grid-template-columns:repeat(2,1fr);
    }

}

</style>
</head>

<body>

<header class="header">

<div class="header-inner">

<div class="logo">

<div class="logo-icon">
ب
</div>

<div>
<strong>مول البركة</strong>
<small>لوحة إدارة المتجر</small>
</div>

</div>

<a href="index.html" class="back">
← العودة للمتجر
</a>

</div>

</header>


<main class="container">

<div class="title">

<h1>
لوحة تحكم المنتجات
</h1>

<p>
أضف المنتجات وعدّل الأسعار والأقسام والوحدات بسهولة
</p>

</div>


<div class="stats">

<div class="stat">
<span>إجمالي المنتجات</span>
<strong id="totalProducts">0</strong>
</div>

<div class="stat">
<span>الخضروات</span>
<strong id="vegetablesCount">0</strong>
</div>

<div class="stat">
<span>الفواكه</span>
<strong id="fruitsCount">0</strong>
</div>

<div class="stat">
<span>العروض</span>
<strong id="offersCount">0</strong>
</div>

</div>


<div class="card">

<div class="card-title">

<h2 id="formTitle">
إضافة منتج جديد
</h2>

<button
type="button"
class="add-new"
id="newProduct"
>
+ منتج جديد
</button>

</div>


<form id="productForm">

<input
type="hidden"
id="productId"
>


<div class="form-grid">


<div class="field">

<label>
اسم المنتج
</label>

<input
id="productName"
type="text"
placeholder="مثال: طماطم بلدي"
required
>

</div>


<div class="field">

<label>
السعر بالجنيه
</label>

<input
id="productPrice"
type="number"
min="0"
step="0.01"
placeholder="مثال: 25"
required
>

</div>


<div class="field">

<label>
القسم
</label>

<select id="productCategory">

<option value="خضروات">
🥬 خضروات
</option>

<option value="فواكه">
🍎 فواكه
</option>

<option value="لحوم">
🥩 لحوم
</option>

<option value="طيور">
🐔 طيور
</option>

<option value="ماركت">
🛒 ماركت
</option>

<option value="عطارة">
🌿 عطارة
</option>

<option value="ألبان">
🥛 ألبان
</option>

<option value="مشروبات">
🧃 مشروبات
</option>

<option value="منظفات">
🧼 منظفات
</option>

</select>

</div>


<div class="field">

<label>
وحدة البيع
</label>

<select id="productUnit">

<option value="كيلو">
كيلو
</option>

<option value="قطعة">
قطعة
</option>

<option value="عبوة">
عبوة
</option>

<option value="كرتونة">
كرتونة
</option>

<option value="زجاجة">
زجاجة
</option>

<option value="كيس">
كيس
</option>

<option value="علبة">
علبة
</option>

<option value="100 جرام">
100 جرام
</option>

</select>

</div>


<div class="field">

<label>
الإيموجي / رمز المنتج
</label>

<input
id="productEmoji"
type="text"
placeholder="🍅"
maxlength="4"
>

</div>


<div class="field">

<label>
حالة المنتج
</label>

<select id="productOffer">

<option value="no">
منتج عادي
</option>

<option value="yes">
🔥 عرض
</option>

</select>

</div>


</div>


<div class="actions">

<button
type="submit"
class="save"
>
حفظ المنتج
</button>

<button
type="button"
class="cancel"
id="cancelEdit"
>
إلغاء
</button>

</div>

</form>

</div>


<div class="card">

<div class="card-title">

<h2>
المنتجات الحالية
</h2>

</div>


<div
class="products"
id="productsList"
>
</div>

</div>

</main>


<div
class="toast"
id="toast"
></div>


<script>

"use strict";


const STORAGE_KEY =
"albaraka_products_v1";


const defaultProducts = [

{
id:"p1",
name:"طماطم بلدي",
price:20,
category:"خضروات",
unit:"كيلو",
emoji:"🍅",
offer:false
},

{
id:"p2",
name:"بطاطس",
price:25,
category:"خضروات",
unit:"كيلو",
emoji:"🥔",
offer:false
},

{
id:"p3",
name:"خيار",
price:30,
category:"خضروات",
unit:"كيلو",
emoji:"🥒",
offer:false
},

{
id:"p4",
name:"موز",
price:35,
category:"فواكه",
unit:"كيلو",
emoji:"🍌",
offer:false
},

{
id:"p5",
name:"تفاح",
price:70,
category:"فواكه",
unit:"كيلو",
emoji:"🍎",
offer:true
},

{
id:"p6",
name:"برتقال",
price:30,
category:"فواكه",
unit:"كيلو",
emoji:"🍊",
offer:false
},

{
id:"p7",
name:"لحمة بلدي",
price:420,
category:"لحوم",
unit:"كيلو",
emoji:"🥩",
offer:false
},

{
id:"p8",
name:"فراخ",
price:115,
category:"طيور",
unit:"كيلو",
emoji:"🐔",
offer:false
},

{
id:"p9",
name:"سكر",
price:35,
category:"ماركت",
unit:"كيلو",
emoji:"🛍️",
offer:false
},

{
id:"p10",
name:"بهارات مشكلة",
price:25,
category:"عطارة",
unit:"100 جرام",
emoji:"🌿",
offer:false
}

];


const form =
document.getElementById(
"productForm"
);

const productId =
document.getElementById(
"productId"
);

const productName =
document.getElementById(
"productName"
);

const productPrice =
document.getElementById(
"productPrice"
);

const productCategory =
document.getElementById(
"productCategory"
);

const productUnit =
document.getElementById(
"productUnit"
);

const productEmoji =
document.getElementById(
"productEmoji"
);

const productOffer =
document.getElementById(
"productOffer"
);

const productsList =
document.getElementById(
"productsList"
);

const toast =
document.getElementById(
"toast"
);


function getProducts(){

try{

const saved =
localStorage.getItem(
STORAGE_KEY
);

if(!saved){

localStorage.setItem(
STORAGE_KEY,
JSON.stringify(
defaultProducts
)
);

return [...defaultProducts];

}

const data =
JSON.parse(saved);

return Array.isArray(data)
? data
: [...defaultProducts];

}catch(error){

return [...defaultProducts];

}

}


function saveProducts(products){

localStorage.setItem(
STORAGE_KEY,
JSON.stringify(products)
);

}


function showToast(message){

toast.textContent =
message;

toast.classList.add(
"show"
);

clearTimeout(
window.toastTimer
);

window.toastTimer =
setTimeout(
function(){

toast.classList.remove(
"show"
);

},
2200
);

}


function escapeHTML(value){

return String(value ?? "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


function render(){

const products =
getProducts();


// الإحصائيات

document.getElementById(
"totalProducts"
).textContent =
products.length;


document.getElementById(
"vegetablesCount"
).textContent =
products.filter(
p => p.category === "خضروات"
).length;


document.getElementById(
"fruitsCount"
).textContent =
products.filter(
p => p.category === "فواكه"
).length;


document.getElementById(
"offersCount"
).textContent =
products.filter(
p => p.offer === true
).length;


// المنتجات

if(products.length === 0){

productsList.innerHTML = `
<div class="empty">
لا توجد منتجات حاليًا
</div>
`;

return;

}


productsList.innerHTML =
products.map(
product => `

<div class="product">

<div class="product-image">

${escapeHTML(
product.emoji || "🛒"
)}

${product.offer
? `<span class="offer">🔥 عرض</span>`
: ""
}

</div>


<div class="product-body">

<h3>
${escapeHTML(
product.name
)}
</h3>

<div class="product-category">

${escapeHTML(
product.category
)}
•
${escapeHTML(
product.unit
)}

</div>

<div class="price">

${Number(
product.price
).toLocaleString("ar-EG")}
 ج.م

</div>


<div class="product-actions">

<button
class="edit"
data-edit="${escapeHTML(
product.id
)}"
>
✏️ تعديل
</button>

<button
class="delete"
data-delete="${escapeHTML(
product.id
)}"
>
🗑️ حذف
</button>

</div>

</div>

</div>

`
).join("");

}


function resetForm(){

form.reset();

productId.value = "";

productOffer.value =
"no";

document.getElementById(
"formTitle"
).textContent =
"إضافة منتج جديد";

}


function editProduct(id){

const products =
getProducts();

const product =
products.find(
p =>
String(p.id) ===
String(id)
);

if(!product){
return;
}


productId.value =
product.id;

productName.value =
product.name;

productPrice.value =
product.price;

productCategory.value =
product.category;

productUnit.value =
product.unit;

productEmoji.value =
product.emoji || "";

productOffer.value =
product.offer
? "yes"
: "no";


document.getElementById(
"formTitle"
).textContent =
"تعديل المنتج";


window.scrollTo({
top:0,
behavior:"smooth"
});

}


function deleteProduct(id){

const products =
getProducts();

const product =
products.find(
p =>
String(p.id) ===
String(id)
);

if(!product){
return;
}


const confirmed =
confirm(
"هل تريد حذف المنتج: " +
product.name +
" ؟"
);

if(!confirmed){
return;
}


const newProducts =
products.filter(
p =>
String(p.id) !==
String(id)
);


saveProducts(
newProducts
);

render();

showToast(
"تم حذف المنتج"
);

}


form.addEventListener(
"submit",
function(event){

event.preventDefault();


const name =
productName.value.trim();

const price =
Number(
productPrice.value
);

const category =
productCategory.value;

const unit =
productUnit.value;

const emoji =
productEmoji.value.trim()
|| "🛒";

const offer =
productOffer.value ===
"yes";


if(!name){

showToast(
"اكتب اسم المنتج"
);

return;

}


if(
!Number.isFinite(price) ||
price < 0
){

showToast(
"اكتب سعرًا صحيحًا"
);

return;

}


const products =
getProducts();


const id =
productId.value;


if(id){

const index =
products.findIndex(
p =>
String(p.id) ===
String(id)
);


if(index === -1){

showToast(
"المنتج غير موجود"
);

return;

}


products[index] = {

...products[index],

name,
price,
category,
unit,
emoji,
offer

};


showToast(
"تم تعديل المنتج بنجاح"
);

}else{


const newProduct = {

id:
"p-" +
Date.now(),

name,
price,
category,
unit,
emoji,
offer

};


products.unshift(
newProduct
);


showToast(
"تم إضافة المنتج بنجاح"
);

}


saveProducts(
products
);

resetForm();

render();

}
);


document.getElementById(
"newProduct"
).addEventListener(
"click",
function(){

resetForm();

window.scrollTo({
top:0,
behavior:"smooth"
});

}
);


document.getElementById(
"cancelEdit"
).addEventListener(
"click",
function(){

resetForm();

}
);


productsList.addEventListener(
"click",
function(event){

const editButton =
event.target.closest(
"[data-edit]"
);

if(editButton){

editProduct(
editButton.dataset.edit
);

return;

}


const deleteButton =
event.target.closest(
"[data-delete]"
);

if(deleteButton){

deleteProduct(
deleteButton.dataset.delete
);

}

}
);


render();

</script>

</body>
</html>
