<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="تسجيل الدخول إلى لوحة تحكم مول البركة أولاد الجارحي"
    >

    <title>
        تسجيل الدخول | مول البركة
    </title>


    <link
        rel="stylesheet"
        href="css/admin.css"
    >


    <style>

        /* =====================================================
           LOGIN PAGE
        ===================================================== */

        body {
            min-height: 100vh;

            background:
                linear-gradient(
                    135deg,
                    #0e3224 0%,
                    #123f2b 48%,
                    #176b45 100%
                );

            overflow-x: hidden;
        }


        .login-page {
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;

            position: relative;
        }


        /* Decorative background */

        .login-page::before {
            content: "";

            position: absolute;

            width: 420px;
            height: 420px;

            top: -180px;
            right: -120px;

            border-radius: 50%;

            background:
                rgba(244, 180, 0, 0.10);
        }


        .login-page::after {
            content: "";

            position: absolute;

            width: 350px;
            height: 350px;

            bottom: -160px;
            left: -120px;

            border-radius: 50%;

            background:
                rgba(255, 255, 255, 0.05);
        }


        /* =====================================================
           LOGIN CARD
        ===================================================== */

        .login-card {
            position: relative;

            z-index: 2;

            width: 100%;

            max-width: 430px;

            padding: 38px;

            background:
                rgba(255, 255, 255, 0.98);

            border-radius: 24px;

            box-shadow:
                0 25px 70px
                rgba(0, 0, 0, 0.25);
        }


        /* =====================================================
           BRAND
        ===================================================== */

        .login-brand {
            text-align: center;

            margin-bottom: 30px;
        }


        .login-logo {
            width: 78px;
            height: 78px;

            margin:
                0 auto 15px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 22px;

            background:
                linear-gradient(
                    135deg,
                    #f4b400,
                    #d79600
                );

            color: #ffffff;

            font-size: 24px;
            font-weight: 900;

            box-shadow:
                0 10px 30px
                rgba(244, 180, 0, 0.28);
        }


        .login-brand h1 {
            color: #17231d;

            font-size: 24px;

            font-weight: 900;

            margin-bottom: 5px;
        }


        .login-brand p {
            color: #7b8880;

            font-size: 12px;
        }


        /* =====================================================
           FORM
        ===================================================== */

        .login-form {
            width: 100%;
        }


        .form-group {
            margin-bottom: 18px;
        }


        .form-label {
            display: block;

            margin-bottom: 7px;

            color: #34423a;

            font-size: 12px;

            font-weight: 800;
        }


        .input-wrapper {
            position: relative;
        }


        .form-input {
            width: 100%;

            height: 50px;

            padding:
                0 45px 0 14px;

            border:
                1px solid #e3e9e5;

            border-radius: 11px;

            background: #fafcfb;

            color: #17231d;

            outline: none;

            font-size: 13px;

            transition:
                border-color .25s ease,
                box-shadow .25s ease,
                background .25s ease;
        }


        .form-input:focus {
            background: #ffffff;

            border-color: #176b45;

            box-shadow:
                0 0 0 4px
                rgba(23, 107, 69, 0.08);
        }


        .input-icon {
            position: absolute;

            top: 50%;
            right: 14px;

            transform:
                translateY(-50%);

            color: #7b8880;

            font-size: 16px;

            pointer-events: none;
        }


        /* Password button */

        .password-toggle {
            position: absolute;

            top: 50%;
            left: 12px;

            transform:
                translateY(-50%);

            width: 30px;
            height: 30px;

            border: 0;

            background: transparent;

            color: #7b8880;

            font-size: 15px;
        }


        .password-toggle:hover {
            color: #176b45;
        }


        /* =====================================================
           REMEMBER
        ===================================================== */

        .login-options {
            display: flex;

            align-items: center;
            justify-content: space-between;

            gap: 10px;

            margin-bottom: 22px;
        }


        .remember-me {
            display: flex;

            align-items: center;

            gap: 7px;

            color: #7b8880;

            font-size: 11px;

            cursor: pointer;
        }


        .remember-me input {
            width: 16px;
            height: 16px;

            accent-color: #176b45;
        }


        /* =====================================================
           LOGIN BUTTON
        ===================================================== */

        .login-button {
            width: 100%;

            height: 52px;

            border: 0;

            border-radius: 11px;

            background:
                linear-gradient(
                    135deg,
                    #176b45,
                    #0f4f32
                );

            color: #ffffff;

            font-size: 13px;

            font-weight: 900;

            box-shadow:
                0 8px 22px
                rgba(23, 107, 69, 0.20);

            transition:
                transform .25s ease,
                box-shadow .25s ease,
                opacity .25s ease;
        }


        .login-button:hover {
            transform:
                translateY(-2px);

            box-shadow:
                0 12px 28px
                rgba(23, 107, 69, 0.28);
        }


        .login-button:active {
            transform:
                translateY(0);
        }


        .login-button.loading {
            opacity: .7;

            cursor: wait;
        }


        /* =====================================================
           ERROR
        ===================================================== */

        .login-message {
            display: none;

            margin-bottom: 17px;

            padding: 11px 13px;

            border-radius: 9px;

            background: #fff0f1;

            border:
                1px solid
                rgba(217, 54, 62, 0.15);

            color: #d9363e;

            font-size: 11px;

            line-height: 1.7;
        }


        .login-message.show {
            display: block;
        }


        .login-message.success {
            background: #eaf8f0;

            border-color:
                rgba(31, 157, 97, 0.15);

            color: #1f9d61;
        }


        /* =====================================================
           SECURITY NOTE
        ===================================================== */

        .security-note {
            margin-top: 22px;

            padding-top: 18px;

            border-top:
                1px solid #e3e9e5;

            text-align: center;

            color: #7b8880;

            font-size: 10px;

            line-height: 1.8;
        }


        .security-icon {
            display: inline-block;

            margin-left: 4px;
        }


        /* =====================================================
           BACK TO WEBSITE
        ===================================================== */

        .back-to-site {
            display: block;

            margin-top: 17px;

            text-align: center;

            color: #176b45;

            font-size: 11px;

            font-weight: 800;
        }


        .back-to-site:hover {
            text-decoration: underline;
        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 480px) {

            .login-page {
                padding: 15px;
            }


            .login-card {
                padding: 28px 20px;

                border-radius: 20px;
            }


            .login-logo {
                width: 68px;
                height: 68px;

                font-size: 21px;
            }


            .login-brand h1 {
                font-size: 21px;
            }

        }

    </style>

</head>


<body>


    <main class="login-page">


        <!-- =================================================
             LOGIN CARD
        ================================================= -->

        <section class="login-card">


            <!-- BRAND -->

            <div class="login-brand">

                <div class="login-logo">
                    البركة
                </div>

                <h1>
                    لوحة تحكم مول البركة
                </h1>

                <p>
                    أولاد الجارحي — الإدارة
                </p>

            </div>


            <!-- =================================================
                 FORM
            ================================================= -->

            <form
                id="adminLoginForm"
                class="login-form"
                novalidate
            >


                <!-- MESSAGE -->

                <div
                    id="loginMessage"
                    class="login-message"
                    role="alert"
                    aria-live="polite"
                ></div>


                <!-- USERNAME -->

                <div class="form-group">

                    <label
                        class="form-label"
                        for="username"
                    >
                        اسم المستخدم
                    </label>


                    <div class="input-wrapper">

                        <span class="input-icon">
                            👤
                        </span>


                        <input
                            id="username"
                            name="username"
                            class="form-input"
                            type="text"
                            autocomplete="username"
                            placeholder="أدخل اسم المستخدم"
                            required
                        >

                    </div>

                </div>


                <!-- PASSWORD -->

                <div class="form-group">

                    <label
                        class="form-label"
                        for="password"
                    >
                        كلمة المرور
                    </label>


                    <div class="input-wrapper">

                        <span class="input-icon">
                            🔒
                        </span>


                        <input
                            id="password"
                            name="password"
                            class="form-input"
                            type="password"
                            autocomplete="current-password"
                            placeholder="أدخل كلمة المرور"
                            required
                        >


                        <button
                            type="button"
                            id="passwordToggle"
                            class="password-toggle"
                            aria-label="إظهار كلمة المرور"
                        >
                            👁
                        </button>

                    </div>

                </div>


                <!-- OPTIONS -->

                <div class="login-options">

                    <label class="remember-me">

                        <input
                            type="checkbox"
                            id="rememberMe"
                            name="rememberMe"
                        >

                        <span>
                            تذكرني
                        </span>

                    </label>

                </div>


                <!-- LOGIN BUTTON -->

                <button
                    type="submit"
                    id="loginButton"
                    class="login-button"
                >
                    تسجيل الدخول
                </button>


            </form>


            <!-- SECURITY -->

            <div class="security-note">

                <span class="security-icon">
                    🔐
                </span>

                الدخول إلى هذه الصفحة مخصص
                لمسؤولي مول البركة فقط.

            </div>


            <!-- BACK -->

            <a
                href="../index.html"
                class="back-to-site"
            >
                ← العودة إلى الموقع
            </a>


        </section>


    </main>


    <!-- =====================================================
         AUTH SCRIPT
    ===================================================== -->

    <script src="js/auth.js"></script>


    <!-- =====================================================
         LOGIN LOGIC
    ===================================================== -->

    <script>

        "use strict";


        document.addEventListener(
            "DOMContentLoaded",
            function () {


                /* =============================================
                   ELEMENTS
                ============================================= */

                const form =
                    document.getElementById(
                        "adminLoginForm"
                    );


                const username =
                    document.getElementById(
                        "username"
                    );


                const password =
                    document.getElementById(
                        "password"
                    );


                const rememberMe =
                    document.getElementById(
                        "rememberMe"
                    );


                const button =
                    document.getElementById(
                        "loginButton"
                    );


                const message =
                    document.getElementById(
                        "loginMessage"
                    );


                const passwordToggle =
                    document.getElementById(
                        "passwordToggle"
                    );


                /* =============================================
                   REMEMBER USERNAME
                ============================================= */

                const savedUsername =
                    localStorage.getItem(
                        "albaraka_admin_username"
                    );


                if (savedUsername) {

                    username.value =
                        savedUsername;

                    rememberMe.checked =
                        true;

                }


                /* =============================================
                   PASSWORD VISIBILITY
                ============================================= */

                passwordToggle.addEventListener(
                    "click",
                    function () {

                        if (
                            password.type ===
                            "password"
                        ) {

                            password.type =
                                "text";

                            passwordToggle.textContent =
                                "🙈";

                            passwordToggle.setAttribute(
                                "aria-label",
                                "إخفاء كلمة المرور"
                            );

                        } else {

                            password.type =
                                "password";

                            passwordToggle.textContent =
                                "👁";

                            passwordToggle.setAttribute(
                                "aria-label",
                                "إظهار كلمة المرور"
                            );

                        }

                    }
                );


                /* =============================================
                   MESSAGE
                ============================================= */

                function showMessage(
                    text,
                    type = "error"
                ) {

                    message.textContent =
                        text;

                    message.className =
                        "login-message show";


                    if (
                        type ===
                        "success"
                    ) {

                        message.classList.add(
                            "success"
                        );

                    }

                }


                function clearMessage() {

                    message.textContent =
                        "";

                    message.className =
                        "login-message";

                }


                /* =============================================
                   SUBMIT
                ============================================= */

                form.addEventListener(
                    "submit",
                    function (event) {

                        event.preventDefault();

                        clearMessage();


                        const user =
                            username.value.trim();


                        const pass =
                            password.value;


                        /* Validation */

                        if (!user) {

                            showMessage(
                                "يرجى إدخال اسم المستخدم."
                            );

                            username.focus();

                            return;

                        }


                        if (!pass) {

                            showMessage(
                                "يرجى إدخال كلمة المرور."
                            );

                            password.focus();

                            return;

                        }


                        /* Loading */

                        button.disabled =
                            true;

                        button.classList.add(
                            "loading"
                        );

                        button.textContent =
                            "جاري تسجيل الدخول...";


                        /*
                           Simulate request
                           for better UX.
                        */

                        setTimeout(
                            function () {


                                const result =
                                    window.AlbarakaAdminAuth.login(
                                        user,
                                        pass
                                    );


                                if (
                                    result.success
                                ) {


                                    /* Save username */

                                    if (
                                        rememberMe.checked
                                    ) {

                                        localStorage.setItem(
                                            "albaraka_admin_username",
                                            user
                                        );

                                    } else {

                                        localStorage.removeItem(
                                            "albaraka_admin_username"
                                        );

                                    }


                                    showMessage(
                                        "تم تسجيل الدخول بنجاح. جاري فتح لوحة التحكم...",
                                        "success"
                                    );


                                    setTimeout(
                                        function () {

                                            window.location.href =
                                                "index.html";

                                        },
                                        500
                                    );


                                } else {


                                    button.disabled =
                                        false;

                                    button.classList.remove(
                                        "loading"
                                    );

                                    button.textContent =
                                        "تسجيل الدخول";


                                    showMessage(
                                        result.message
                                    );


                                    password.focus();

                                }


                            },
                            400
                        );

                    }
                );


                /* =============================================
                   ENTER KEY
                ============================================= */

                username.addEventListener(
                    "keydown",
                    function (event) {

                        if (
                            event.key ===
                            "Enter"
                        ) {

                            password.focus();

                        }

                    }
                );


            }
        );

    </script>

</body>

</html>
