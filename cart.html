<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>سلة المشتريات - مول البركة</title>

    <link rel="stylesheet" href="cart.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Tahoma, Arial, sans-serif;
            background: #f5f7f5;
            color: #222;
        }

        .top {
            background: #00843d;
            color: white;
            padding: 16px;
            box-shadow: 0 3px 15px rgba(0,0,0,.15);
        }

        .top-inner {
            max-width: 1200px;
            margin: auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        .back {
            color: #00843d;
            background: white;
            text-decoration: none;
            padding: 10px 16px;
            border-radius: 10px;
            font-weight: bold;
        }

        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 15px 50px;
        }

        .title {
            font-size: 30px;
            font-weight: bold;
            margin-bottom: 25px;
        }

        .layout {
            display: grid;
            grid-template-columns: 1fr 350px;
            gap: 25px;
        }

        .box {
            background: white;
            border-radius: 18px;
            padding: 20px;
            box-shadow: 0 3px 18px rgba(0,0,0,.07);
        }

        .cart-item {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 18px 0;
            border-bottom: 1px solid #eee;
        }

        .cart-item:last-child {
            border-bottom: 0;
        }

        .item-image {
            width: 95px;
            height: 95px;
            border-radius: 15px;
            object-fit: cover;
            background: #f1f1f1;
        }

        .item-info {
            flex: 1;
        }

        .item-name {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 7px;
        }

        .item-price {
            color: #00843d;
            font-size: 17px;
            font-weight: bold;
        }

        .item-total {
            margin-top: 6px;
            font-weight: bold;
        }

        .quantity {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .quantity button {
            width: 36px;
            height: 36px;
            border: 0;
            border-radius: 9px;
            background: #00843d;
            color: white;
            font-size: 21px;
            cursor: pointer;
        }

        .quantity span {
            min-width: 30px;
            text-align: center;
            font-weight: bold;
        }

        .remove {
            border: 0;
            background: transparent;
            color: #d62828;
            cursor: pointer;
            margin-top: 8px;
            font-size: 14px;
        }

        .summary h2 {
            margin-top: 0;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            padding: 14px 0;
            border-bottom: 1px solid #eee;
        }

        .total {
            display: flex;
            justify-content: space-between;
            font-size: 23px;
            font-weight: bold;
            color: #00843d;
            padding: 20px 0 5px;
        }

        .checkout {
            display: block;
            text-align: center;
            background: #00843d;
            color: white;
            text-decoration: none;
            padding: 15px;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            margin-top: 18px;
        }

        .clear {
            width: 100%;
            border: 0;
            background: #f3f3f3;
            color: #d62828;
            padding: 12px;
            border-radius: 10px;
            margin-top: 10px;
            cursor: pointer;
            font-weight: bold;
        }

        .empty {
            text-align: center;
            padding: 80px 20px;
        }

        .empty-icon {
            font-size: 70px;
        }

        .empty h2 {
            margin: 15px 0 8px;
        }

        .shop {
            display: inline-block;
            margin-top: 15px;
            background: #00843d;
            color: white;
            text-decoration: none;
            padding: 13px 25px;
            border-radius: 12px;
            font-weight: bold;
        }

        .loading {
            text-align: center;
            padding: 60px;
            color: #777;
        }

        @media(max-width:800px) {

            .layout {
                grid-template-columns: 1fr;
            }

            .cart-item {
                align-items: flex-start;
                flex-wrap: wrap;
            }

            .item-info {
                min-width: calc(100% - 120px);
            }

            .quantity {
                margin-right: 110px;
            }
        }

        @media(max-width:500px) {

            .logo {
                font-size: 18px;
            }

            .top-inner {
                gap: 8px;
            }

            .title {
                font-size: 25px;
            }

            .item-image {
                width: 75px;
                height: 75px;
            }

            .item-info {
                min-width: calc(100% - 95px);
            }

            .quantity {
                margin-right: 0;
            }
        }
    </style>
</head>

<body>

<header class="top">

    <div class="top-inner">

        <div class="logo">
            🛒 مول البركة
        </div>

        <a href="index.html" class="back">
            ← متابعة التسوق
        </a>

    </div>

</header>


<main class="container">

    <div class="title">
        سلة المشتريات 🛒
    </div>


    <div id="cartArea">

        <div class="loading">
            جاري تحميل السلة...
        </div>

    </div>

</main>


<!--
    مهم:
    لا نضع supabase.js هنا.
    cart.js يعمل مباشرة مع localStorage
    ولا يحتاج Supabase لعرض السلة.
-->

<script src="cart.js"></script>

</body>
</html>
