<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>متجر كارفور المتطور</title>
  <link rel="stylesheet" href="styles.css" />
  <script defer src="products.js"></script>
  <script defer src="cart.js"></script>
</head>
<body>
  <header>
    <h1>متجر كارفور</h1>
    <nav>
      <button class="category-btn active" data-category="all">الكل</button>
      <button class="category-btn" data-category="vegetables">الخضروات</button>
      <button class="category-btn" data-category="fruits">الفواكه</button>
      <button class="category-btn" data-category="meats">اللحوم</button>
      <button class="category-btn" data-category="poultry">الطيور</button>
      <button class="category-btn" data-category="spices">العطارة</button>
    </nav>
    <div class="cart" id="cart-container">
      <button id="cart-btn">سلة التسوق (<span id="cart-count">0</span>)</button>
    </div>
  </header>

  <main>
    <section id="products-container" class="products-grid"></section>
  </main>

  <div id="cart-modal" class="modal hidden">
    <div class="modal-content">
      <span id="close-cart" class="close">&times;</span>
      <h2>سلة التسوق</h2>
      <ul id="cart-items"></ul>
      <p>المجموع: <span id="total-price">0</span> جنيه</p>

      <h3>طرق الدفع</h3>
      <div class="payment-options">
        <button id="pay-cash-btn" class="pay-btn">الدفع كاش عند الاستلام</button>
        <button id="pay-wallet-btn" class="pay-btn">الدفع عبر المحفظة (محاكاة)</button>
        <button id="pay-whatsapp-btn" class="pay-btn">تحويل الطلب على واتساب</button>
      </div>
    </div>
  </div>

  <div id="overlay" class="hidden"></div>

</body>
</html>
