<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>البركة مول</title>

<style>
body{
margin:0;
font-family:Tahoma,Arial,sans-serif;
background:#f5f5f5;
color:#333;
}

header{
background:#0d6efd;
color:white;
padding:20px;
text-align:center;
}

.hero{
padding:60px 20px;
text-align:center;
}

.hero h1{
font-size:38px;
margin-bottom:10px;
}

.hero p{
font-size:20px;
color:#666;
}

.btn{
display:inline-block;
margin-top:20px;
padding:15px 35px;
background:#0d6efd;
color:white;
text-decoration:none;
border-radius:8px;
font-size:18px;
}

.services{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
padding:40px;
}

.card{
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 2px 10px rgba(0,0,0,.1);
text-align:center;
}

footer{
background:#222;
color:white;
text-align:center;
padding:20px;
margin-top:40px;
}
</style>

</head>

<body>

<header>
<h2>البركة مول</h2>
</header>

<section class="hero">
<h1>مرحباً بكم في البركة مول</h1>
<p>أفضل مكان للتسوق والخدمات الإلكترونية.</p>

<a class="btn" href="#">ابدأ الآن</a>
</section>

<section class="services">

<div class="card">
<h3>🛍️ التسوق</h3>
<p>أفضل المنتجات بأفضل الأسعار.</p>
</div>

<div class="card">
<h3>💳 الدفع الإلكتروني</h3>
<p>طرق دفع آمنة وسريعة.</p>
</div>

<div class="card">
<h3>🚚 التوصيل</h3>
<p>خدمة توصيل لجميع المحافظات.</p>
</div>

</section>

<footer>
© 2026 جميع الحقوق محفوظة - البركة مول
</footer>

</body>
</html>
