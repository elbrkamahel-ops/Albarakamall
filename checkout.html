<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>إتمام الطلب - مول البركة</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Tahoma, sans-serif;
      background: #f5f7f8;
      color: #222;
    }

    .header {
      background: #fff;
      padding: 22px 15px;
      text-align: center;
      box-shadow: 0 2px 15px rgba(0,0,0,.08);
    }

    .logo {
      font-size: 32px;
      font-weight: bold;
      color: #168344;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #777;
      font-size: 18px;
    }

    .container {
      width: min(950px, 94%);
      margin: 25px auto 50px;
    }

    .box {
      background: white;
      border-radius: 18px;
      padding: 22px;
      margin-bottom: 20px;
      box-shadow: 0 5px 25px rgba(0,0,0,.06);
    }

    h2 {
      margin-top: 0;
      color: #168344;
    }

    label {
      display: block;
      margin: 14px 0 7px;
      font-weight: bold;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 12px;
      font-size: 16px;
      outline: none;
      background: #fff;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: #168344;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      padding: 14px 0;
      border-bottom: 1px solid #eee;
    }

    .cart-item:last-child {
      border-bottom: 0;
    }

    .item-name {
      font-weight: bold;
    }

    .item-details {
      color: #777;
      margin-top: 5px;
      font-size: 14px;
    }

    .price {
      color: #168344;
      font-weight: bold;
      white-space: nowrap;
    }

    .total-box {
      display: flex;
      justify-content: space-between;
      padding-top: 18px;
      margin-top: 10px;
      border-top: 2px solid #eee;
      font-size: 21px;
      font-weight: bold;
    }

    .submit-btn {
      width: 100%;
      border: 0;
      background: #168344;
      color: white;
      padding: 17px;
      border-radius: 14px;
      font-size: 19px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }

    .submit-btn:hover {
      background: #106b35;
    }

    .submit-btn:disabled {
      background: #aaa;
      cursor: not-allowed;
    }

    .message {
      display: none;
      padding: 18px;
      border-radius: 14px;
      margin-bottom: 20px;
      text-align: center;
      font-weight: bold;
    }

    .success {
      background: #e8f8ee;
      color: #117238;
      border: 1px solid #a9dfbd;
    }

    .error {
      background: #fff0f0;
      color: #b42318;
      border: 1px solid #f1b4b0;
    }

    .loading {
      text-align: center;
      padding: 30px;
      color: #777;
      font-size: 18px;
    }

    .order-number {
      font-size: 26px;
      color: #168344;
      margin: 15px 0;
    }

    .empty {
      text-align: center;
      padding: 35px 15px;
      color: #777;
    }

    .back-btn {
      display: block;
      text-align: center;
      text-decoration: none;
      color: #168344;
      margin-top: 15px;
      font-weight: bold;
    }

    @media (max-width: 600px) {
      .logo {
        font-size: 27px;
      }

      .box {
        padding: 17px;
      }

      .cart-item {
        align-items: flex-start;
      }
    }
  </style>
</head>

<body>

<header class="header">
  <div class="logo">مول البركة</div>
  <div class="subtitle">إتمام الطلب</div>
</header>

<main class="container">

  <!-- رسالة الخطأ -->
  <div id="errorMessage" class="message error"></div>

  <!-- رسالة النجاح -->
  <div id="successMessage" class="message success">
    <div>✅ تم تسجيل طلبك بنجاح</div>

    <div class="order-number">
      رقم الطلب:
      <span id="orderNumber"></span>
    </div>

    <div>
      سيتم تجهيز طلبك والتواصل معك قريبًا.
    </div>

    <a href="index.html" class="back-btn">
      العودة إلى المتجر
    </a>
  </div>

  <!-- بيانات العميل -->
  <section class="box" id="checkoutFormBox">

    <h2>بيانات العميل</h2>

    <form id="checkoutForm">

      <label for="customerName">الاسم بالكامل *</label>
      <input
        type="text"
        id="customerName"
        name="customerName"
        placeholder="اكتب اسمك"
        required
      >

      <label for="phone">رقم الهاتف *</label>
      <input
        type="tel"
        id="phone"
        name="phone"
        placeholder="01xxxxxxxxx"
        required
      >

      <label for="address">العنوان *</label>
      <textarea
        id="address"
        name="address"
        placeholder="اكتب العنوان بالتفصيل"
        required
      ></textarea>

      <label for="city">المدينة / المنطقة</label>
      <input
        type="text"
        id="city"
        name="city"
        placeholder="المدينة أو المنطقة"
      >

      <label for="paymentMethod">طريقة الدفع</label>

      <select id="paymentMethod" name="paymentMethod">
        <option value="الدفع عند الاستلام">الدفع عند الاستلام</option>
      </select>

      <label for="notes">ملاحظات إضافية</label>

      <textarea
        id="notes"
        name="notes"
        placeholder="أي ملاحظات خاصة بالطلب"
      ></textarea>

      <button
        type="submit"
        id="submitButton"
        class="submit-btn"
      >
        تأكيد الطلب
      </button>

    </form>

  </section>

  <!-- السلة -->
  <section class="box">

    <h2>مراجعة الطلب</h2>

    <div id="cartContainer">
      <div class="loading">
        جاري تحميل السلة...
      </div>
    </div>

  </section>

</main>

/*

إظهار الخطأ

*/

function showError(message) {

  errorMessage.textContent = message;

  errorMessage.style.display = "block";

  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });
}


/*
===========================================================
إخفاء الخطأ
===========================================================
*/

function hideError() {

  errorMessage.style.display = "none";
}


/*
===========================================================
البحث عن السلة في LocalStorage
===========================================================
*/

function loadCart() {

  const possibleKeys = [
    "cart",
    "Cart",
    "shoppingCart",
    "shopping_cart",
    "albaraka_cart",
    "AlbarakaCart",
    "cartItems",
    "cart_items"
  ];

  let found = null;

  for (const key of possibleKeys) {

    const value = localStorage.getItem(key);

    if (!value) continue;

    try {

      const parsed = JSON.parse(value);

      if (Array.isArray(parsed)) {
        found = parsed;
        break;
      }

      if (
        parsed &&
        Array.isArray(parsed.items)
      ) {
        found = parsed.items;
        break;
      }

      if (
        parsed &&
        Array.isArray(parsed.cart)
      ) {
        found = parsed.cart;
        break;
      }

    } catch (e) {

      console.log(
        "تعذر قراءة السلة:",
        key,
        e
      );

    }
  }

  return found || [];
}


/*
===========================================================
تحويل رقم
===========================================================
*/

function numberValue(value) {

  const n = Number(value);

  if (Number.isFinite(n)) {
    return n;
  }

  return 0;
}


/*
===========================================================
اسم المنتج
===========================================================
*/

function getProductName(item) {

  return (
    item.product_name ||
    item.productName ||
    item.name ||
    item.title ||
    "منتج"
  );
}


/*
===========================================================
سعر المنتج
===========================================================
*/

function getProductPrice(item) {

  return numberValue(
    item.price ??
    item.product_price ??
    item.productPrice ??
    item.unit_price ??
    0
  );
}


/*
===========================================================
كمية المنتج
===========================================================
*/

function getProductQuantity(item) {

  const quantity =
    item.quantity ??
    item.qty ??
    item.count ??
    1;

  const q = parseInt(quantity);

  if (!Number.isFinite(q) || q < 1) {
    return 1;
  }

  return q;
}


/*
===========================================================
معرف المنتج
===========================================================
*/

function getProductId(item) {

  return (
    item.product_id ??
    item.productId ??
    item.id ??
    null
  );
}


/*
===========================================================
حساب الإجمالي
===========================================================
*/

function calculateTotal() {

  let total = 0;

  cart.forEach(item => {

    const price =
      getProductPrice(item);

    const quantity =
      getProductQuantity(item);

    total += price * quantity;

  });

  return Number(total.toFixed(2));
}

عرض السلة
===========================================================
*/
