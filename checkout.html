<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>إتمام الطلب - مول البركة</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Tahoma, Arial, sans-serif;
      background: #f5f7f6;
      color: #222;
    }

    header {
      background: white;
      padding: 25px 15px;
      text-align: center;
      box-shadow: 0 2px 10px rgba(0,0,0,.08);
    }

    header h1 {
      margin: 0;
      color: #16833f;
      font-size: 32px;
    }

    header p {
      margin: 10px 0 0;
      color: #777;
      font-size: 18px;
    }

    .container {
      max-width: 700px;
      margin: 30px auto;
      padding: 15px;
    }

    .box {
      background: white;
      border-radius: 18px;
      padding: 25px;
      box-shadow: 0 5px 25px rgba(0,0,0,.08);
    }

    h2 {
      margin-top: 0;
      color: #16833f;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
      font-family: inherit;
      outline: none;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: #16833f;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    .total {
      margin-top: 25px;
      padding: 18px;
      background: #f0faf4;
      border-radius: 12px;
      font-size: 22px;
      font-weight: bold;
      color: #16833f;
      text-align: center;
    }

    button {
      width: 100%;
      border: 0;
      margin-top: 20px;
      padding: 16px;
      border-radius: 12px;
      background: #16833f;
      color: white;
      font-size: 19px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #116b34;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .message {
      display: none;
      margin-top: 20px;
      padding: 15px;
      border-radius: 12px;
      text-align: center;
      font-weight: bold;
    }

    .success {
      display: block;
      background: #e9f8ef;
      color: #16833f;
    }

    .error {
      display: block;
      background: #fff0f0;
      color: #c62828;
    }

    .back {
      display: block;
      margin-top: 15px;
      text-align: center;
      color: #16833f;
      text-decoration: none;
    }
  </style>
</head>

<body>

<header>
  <h1>مول البركة</h1>
  <p>إتمام الطلب</p>
</header>

<div class="container">

  <div class="box">

    <h2>بيانات التوصيل</h2>

    <form id="checkoutForm">

      <label>الاسم بالكامل</label>
      <input
        type="text"
        id="customerName"
        placeholder="اكتب اسمك"
        required
      >

      <label>رقم الهاتف</label>
      <input
        type="tel"
        id="phone"
        placeholder="01xxxxxxxxx"
        required
      >

      <label>العنوان</label>
      <textarea
        id="address"
        placeholder="اكتب العنوان بالتفصيل"
        required
      ></textarea>

      <label>المدينة / المنطقة</label>
      <input
        type="text"
        id="city"
        placeholder="مثال: القاهرة"
        required
      >

      <label>طريقة الدفع</label>
      <select id="paymentMethod">
        <option value="الدفع عند الاستلام">الدفع عند الاستلام</option>
      </select>

      <label>ملاحظات إضافية</label>
      <textarea
        id="notes"
        placeholder="أي ملاحظات على الطلب..."
      ></textarea>

      <div class="total">
        الإجمالي:
        <span id="total">0</span>
        جنيه
      </div>

      <button type="submit" id="submitBtn">
        تأكيد وإتمام الطلب
      </button>

    </form>

    <div id="message" class="message"></div>

    <a href="shop.html" class="back">
      ← العودة إلى المتجر
    </a>

  </div>

</div>

<script>

  /* ==============================
     SUPABASE
  ============================== */

  const SUPABASE_URL =
    "https://YOUR-PROJECT.supabase.co";

  const SUPABASE_ANON_KEY =
    "YOUR-ANON-KEY";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );


  /* ==============================
     CART
  ============================== */

  function getCart() {

    const possibleKeys = [
      "cart",
      "cartItems",
      "shoppingCart",
      "albaraka_cart"
    ];

    for (const key of possibleKeys) {

      try {

        const value = localStorage.getItem(key);

        if (!value) continue;

        const parsed = JSON.parse(value);

        if (Array.isArray(parsed) && parsed.length > 0) {
          return parsed;
        }

        if (
          parsed &&
          typeof parsed === "object" &&
          Object.keys(parsed).length > 0
        ) {
          return parsed;
        }

      } catch (error) {
        console.log("Cart read error:", error);
      }
    }

    return [];
  }


  /* ==============================
     CALCULATE TOTAL
  ============================== */

  function calculateTotal(cart) {

    let total = 0;

    if (Array.isArray(cart)) {

      cart.forEach(item => {

        const price =
          Number(
            item.price ??
            item.product_price ??
            item.unit_price ??
            0
          );

        const quantity =
          Number(
            item.quantity ??
            item.qty ??
            item.count ??
            1
          );

        total += price * quantity;

      });

    } else {

      Object.values(cart).forEach(item => {

        if (typeof item === "number") {
          return;
        }

        const price =
          Number(
            item.price ??
            item.product_price ??
            item.unit_price ??
            0
          );

        const quantity =
          Number(
            item.quantity ??
            item.qty ??
            item.count ??
            1
          );

        total += price * quantity;

      });

    }

    return total;
  }


  /* ==============================
     SHOW TOTAL
  ============================== */

  const cart = getCart();

  const total = calculateTotal(cart);

  document.getElementById("total").textContent =
    total.toFixed(2);


  /* ==============================
     FORM SUBMIT
  ============================== */

  document
    .getElementById("checkoutForm")
    .addEventListener("submit", async function(event) {

      event.preventDefault();

      const button =
        document.getElementById("submitBtn");

      const message =
        document.getElementById("message");

      button.disabled = true;

      button.textContent =
        "جاري تسجيل الطلب...";

      message.className = "message";
      message.textContent = "";


      try {

        /* ==========================
           CHECK CART
        ========================== */

        if (!cart || (
          Array.isArray(cart)
            ? cart.length === 0
            : Object.keys(cart).length === 0
        )) {

          throw new Error(
            "السلة فارغة، أضف منتجات أولاً."
          );

        }


        /* ==========================
           FORM DATA
        ========================== */

        const customerName =
          document
            .getElementById("customerName")
            .value
            .trim();

        const phone =
          document
            .getElementById("phone")
            .value
            .trim();

        const address =
          document
            .getElementById("address")
            .value
            .trim();

        const city =
          document
            .getElementById("city")
            .value
            .trim();

        const paymentMethod =
          document
            .getElementById("paymentMethod")
            .value;

        const notes =
          document
            .getElementById("notes")
            .value
            .trim();


        if (!customerName ||
            !phone ||
            !address ||
            !city) {

          throw new Error(
            "من فضلك أكمل جميع بيانات التوصيل."
          );

        }


        /* ==========================
           CREATE ORDER NUMBER
        ========================== */

        const orderNumber =
          "BRK-" +
          Date.now();


        /* ==========================
           INSERT ORDER
           يستخدم الأعمدة الظاهرة
           في جدول orders
        ========================== */

        const orderData = {

          customer_name:
            customerName,

          phone:
            phone,

          address:
            address,

          city:
            city,

          total:
            total,

          status:
            "جديد"

        };


        /*
          نحاول أولاً إدخال البيانات
          الأساسية الموجودة في جدول orders.
        */

        const {
          data: order,
          error: orderError
        } = await supabaseClient
          .from("orders")
          .insert(orderData)
          .select()
          .single();


        if (orderError) {

          console.error(
            "ORDER ERROR:",
            orderError
          );

          throw new Error(
            "تعذر تسجيل الطلب في قاعدة البيانات: " +
            orderError.message
          );

        }


        /* ==========================
           GET ORDER ID
        ========================== */

        const orderId = order.id;


        /* ==========================
           INSERT ORDER ITEMS
        ========================== */

        const items = [];

        if (Array.isArray(cart)) {

          cart.forEach(item => {

            const productId =
              String(
                item.id ??
                item.product_id ??
                ""
              );

            const productName =
              String(
                item.name ??
                item.product_name ??
                "منتج"
              );

            const price =
              Number(
                item.price ??
                item.product_price ??
                item.unit_price ??
                0
              );

            const quantity =
              Number(
                item.quantity ??
                item.qty ??
                item.count ??
                1
              );

            items.push({

              order_id:
                orderId,

              product_id:
                productId,

              product_name:
                productName,

              quantity:
                quantity,

              price:
                price

            });

          });

        }


        if (items.length > 0) {

          const {
            error: itemsError
          } = await supabaseClient
            .from("order_items")
            .insert(items);


          if (itemsError) {

            console.error(
              "ITEMS ERROR:",
              itemsError
            );

            /*
              لا نعتبر الطلب فاشلاً هنا
              لأن سجل orders تم إنشاؤه بالفعل.
            */

          }

        }


        /* ==========================
           SUCCESS
        ========================== */

        message.className =
          "message success";

        message.innerHTML =
          "✅ تم تسجيل طلبك بنجاح<br><br>" +
          "رقم الطلب: <strong>" +
          orderNumber +
          "</strong><br><br>" +
          "سيتم التواصل معك لتأكيد الطلب.";


        button.textContent =
          "تم تسجيل الطلب ✓";


        /* ==========================
           EMPTY CART
        ========================== */

        localStorage.removeItem("cart");
        localStorage.removeItem("cartItems");
        localStorage.removeItem("shoppingCart");
        localStorage.removeItem("albaraka_cart");


        document
          .getElementById("checkoutForm")
          .reset();


      } catch (error) {

        console.error(error);

        message.className =
          "message error";

        message.textContent =
          "❌ " +
          error.message;


        button.disabled = false;

        button.textContent =
          "تأكيد وإتمام الطلب";

      }

    });

</script>

</body>
</html>
