<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>إتمام الطلب | مول البركة</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Tahoma,Arial,sans-serif;
    background:#f5f7f5;
    color:#222;
}

.header{
    background:#00843d;
    color:white;
    padding:18px;
    box-shadow:0 3px 15px rgba(0,0,0,.15);
}

.header-inner{
    max-width:1100px;
    margin:auto;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
}

.logo{
    font-size:24px;
    font-weight:bold;
}

.back{
    background:white;
    color:#00843d;
    text-decoration:none;
    padding:10px 16px;
    border-radius:10px;
    font-weight:bold;
}

.container{
    max-width:1100px;
    margin:30px auto;
    padding:0 15px 60px;
}

.title{
    font-size:30px;
    font-weight:bold;
    margin-bottom:25px;
}

.grid{
    display:grid;
    grid-template-columns:1fr 380px;
    gap:25px;
}

.box{
    background:white;
    padding:22px;
    border-radius:18px;
    box-shadow:0 3px 18px rgba(0,0,0,.07);
}

.box h2{
    margin-top:0;
}

.form-group{
    margin-bottom:18px;
}

.form-group label{
    display:block;
    margin-bottom:7px;
    font-weight:bold;
}

.form-group input,
.form-group textarea,
.form-group select{
    width:100%;
    border:1px solid #ddd;
    border-radius:10px;
    padding:14px;
    font-size:16px;
    outline:none;
    font-family:inherit;
}

.form-group textarea{
    min-height:100px;
    resize:vertical;
}

.form-group input:focus,
.form-group textarea:focus,
.form-group select:focus{
    border-color:#00843d;
}

.payment{
    display:grid;
    gap:10px;
}

.payment label{
    border:1px solid #ddd;
    padding:14px;
    border-radius:10px;
    cursor:pointer;
}

.payment input{
    margin-left:8px;
}

.order-item{
    display:flex;
    justify-content:space-between;
    gap:10px;
    padding:13px 0;
    border-bottom:1px solid #eee;
}

.order-item:last-child{
    border-bottom:0;
}

.order-name{
    font-weight:bold;
}

.order-qty{
    color:#777;
    font-size:14px;
    margin-top:4px;
}

.order-price{
    color:#00843d;
    font-weight:bold;
    white-space:nowrap;
}

.total{
    display:flex;
    justify-content:space-between;
    font-size:22px;
    font-weight:bold;
    color:#00843d;
    padding-top:20px;
    margin-top:10px;
    border-top:2px solid #eee;
}

.submit{
    width:100%;
    border:0;
    background:#00843d;
    color:white;
    padding:16px;
    border-radius:12px;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    margin-top:20px;
}

.submit:hover{
    background:#006b32;
}

.submit:disabled{
    background:#aaa;
    cursor:not-allowed;
}

.empty{
    text-align:center;
    padding:70px 20px;
}

.empty-icon{
    font-size:70px;
}

.shop{
    display:inline-block;
    margin-top:15px;
    background:#00843d;
    color:white;
    text-decoration:none;
    padding:13px 25px;
    border-radius:12px;
}

.success{
    display:none;
    text-align:center;
    padding:50px 20px;
}

.success-icon{
    font-size:70px;
}

.success h2{
    color:#00843d;
}

.order-number{
    background:#f1f8f3;
    padding:15px;
    border-radius:10px;
    margin:20px 0;
    font-weight:bold;
}

.error{
    background:#fff1f1;
    color:#c62828;
    padding:12px;
    border-radius:10px;
    margin-top:15px;
    display:none;
}

@media(max-width:800px){

    .grid{
        grid-template-columns:1fr;
    }

    .title{
        font-size:25px;
    }

    .logo{
        font-size:19px;
    }

}

</style>

</head>

<body>


<header class="header">

<div class="header-inner">

<div class="logo">
🛒 مول البركة
</div>

<a href="cart.html" class="back">
← العودة للسلة
</a>

</div>

</header>


<main class="container">


<div class="title">
إتمام الطلب 🛍️
</div>


<!-- منطقة الطلب -->

<div id="orderPage">

<div class="grid">


<!-- بيانات العميل -->

<div class="box">

<h2>
بيانات التوصيل
</h2>


<div class="form-group">

<label>
الاسم بالكامل
</label>

<input
type="text"
id="customerName"
placeholder="اكتب اسمك بالكامل"
autocomplete="name">

</div>


<div class="form-group">

<label>
رقم الهاتف
</label>

<input
type="tel"
id="customerPhone"
placeholder="01xxxxxxxxx"
autocomplete="tel">

</div>


<div class="form-group">

<label>
العنوان
</label>

<textarea
id="customerAddress"
placeholder="اكتب عنوان التوصيل بالتفصيل"></textarea>

</div>


<div class="form-group">

<label>
ملاحظات الطلب
</label>

<textarea
id="customerNotes"
placeholder="أي ملاحظات إضافية؟"></textarea>

</div>


<h2>
طريقة الدفع
</h2>


<div class="payment">

<label>

<input
type="radio"
name="payment"
value="cash"
checked>

الدفع عند الاستلام

</label>


<label>

<input
type="radio"
name="payment"
value="card">

الدفع الإلكتروني

</label>

</div>


<div
id="error"
class="error">
</div>


<button
type="button"
class="submit"
id="submitOrder">

تأكيد الطلب

</button>

</div>


<!-- ملخص الطلب -->

<div class="box">

<h2>
ملخص طلبك
</h2>


<div id="orderItems">

</div>


<div class="total">

<span>
الإجمالي
</span>

<span id="orderTotal">
0 جنيه
</span>

</div>

</div>


</div>

</div>


<!-- نجاح الطلب -->

<div
id="success"
class="box success">

<div class="success-icon">
✅
</div>

<h2>
تم استلام طلبك بنجاح
</h2>

<p>
شكرًا لطلبك من مول البركة.
</p>

<div class="order-number">

رقم الطلب:

<span id="orderNumber">
</span>

</div>

<a
href="index.html"
class="shop">

العودة للمتجر

</a>

</div>


<!-- سلة فارغة -->

<div
id="empty"
class="box empty"
style="display:none;">

<div class="empty-icon">
🛒
</div>

<h2>
السلة فارغة
</h2>

<p>
لا يمكن إتمام الطلب بدون منتجات.
</p>

<a
href="index.html"
class="shop">

العودة للتسوق

</a>

</div>


</main>


<script>

"use strict";


/* =====================================================
   قراءة السلة
===================================================== */

function getCart(){

    const keys = [
        "checkout_cart",
        "albaraka_cart",
        "shopping_cart",
        "cart"
    ];

    for(const key of keys){

        const data =
            key === "checkout_cart"
            ? sessionStorage.getItem(key)
            : localStorage.getItem(key);

        if(!data){
            continue;
        }

        try{

            const cart = JSON.parse(data);

            if(Array.isArray(cart) && cart.length > 0){

                return cart;

            }

            if(typeof cart === "object" && cart !== null){

                return Object.values(cart);

            }

        }catch(error){

            console.error(error);

        }

    }

    return [];

}


/* =====================================================
   تحويل المنتج لصيغة موحدة
===================================================== */

function normalize(item){

    return {

        id:
            item.id ??
            item.product_id ??
            item.productId ??
            Date.now(),

        name:
            item.name ??
            item.product_name ??
            item.title ??
            "منتج",

        price:
            Number(
                item.price ??
                item.sale_price ??
                item.product_price ??
                0
            ),

        quantity:
            Number(
                item.quantity ??
                item.qty ??
                item.count ??
                1
            )

    };

}


/* =====================================================
   السعر
===================================================== */

function money(number){

    return Number(number || 0)
        .toLocaleString("ar-EG")
        + " جنيه";

}


/* =====================================================
   عرض الطلب
===================================================== */

function renderOrder(){

    const raw =
        getCart();

    const cart =
        raw
        .map(normalize)
        .filter(item => item.quantity > 0);


    if(cart.length === 0){

        document
            .getElementById("orderPage")
            .style.display = "none";

        document
            .getElementById("empty")
            .style.display = "block";

        return;

    }


    let html = "";

    let total = 0;


    cart.forEach(function(item){

        const subtotal =
            item.price *
            item.quantity;


        total += subtotal;


        html += `

            <div class="order-item">

                <div>

                    <div class="order-name">
                        ${escapeHTML(item.name)}
                    </div>

                    <div class="order-qty">
                        الكمية:
                        ${item.quantity}
                    </div>

                </div>

                <div class="order-price">
                    ${money(subtotal)}
                </div>

            </div>

        `;

    });


    document
        .getElementById("orderItems")
        .innerHTML = html;


    document
        .getElementById("orderTotal")
        .textContent =
        money(total);

}


/* =====================================================
   تأكيد الطلب
===================================================== */

document
    .getElementById("submitOrder")
    .addEventListener("click", function(){

        const name =
            document
                .getElementById("customerName")
                .value
                .trim();


        const phone =
            document
                .getElementById("customerPhone")
                .value
                .trim();


        const address =
            document
                .getElementById("customerAddress")
                .value
                .trim();


        const notes =
            document
                .getElementById("customerNotes")
                .value
                .trim();


        const payment =
            document
                .querySelector(
                    'input[name="payment"]:checked'
                )
                ?.value;


        const error =
            document.getElementById("error");


        error.style.display = "none";


        if(name.length < 2){

            showError(
                "من فضلك اكتب الاسم بالكامل."
            );

            return;

        }


        if(phone.length < 10){

            showError(
                "من فضلك اكتب رقم هاتف صحيح."
            );

            return;

        }


        if(address.length < 5){

            showError(
                "من فضلك اكتب عنوان التوصيل."
            );

            return;

        }


        const cart =
            getCart()
            .map(normalize)
            .filter(item => item.quantity > 0);


        if(cart.length === 0){

            showError(
                "السلة فارغة."
            );

            return;

        }


        let total = 0;


        cart.forEach(function(item){

            total +=
                item.price *
                item.quantity;

        });


        /* إنشاء رقم طلب */

        const orderNumber =
            "BRK-" +
            Date.now()
            .toString()
            .slice(-8);


        /* تجهيز بيانات الطلب */

        const order = {

            order_number:
                orderNumber,

            customer_name:
                name,

            customer_phone:
                phone,

            customer_address:
                address,

            notes:
                notes,

            payment_method:
                payment,

            items:
                cart,

            total:
                total,

            created_at:
                new Date().toISOString()

        };


        /*
         * نحفظ نسخة محلية من الطلب.
         * وبعد ذلك يمكن ربطها مباشرة بجدول
         * Supabase الخاص بالطلبات.
         */

        const oldOrders =
            JSON.parse(
                localStorage.getItem(
                    "albaraka_orders"
                ) || "[]"
            );


        oldOrders.push(order);


        localStorage.setItem(
            "albaraka_orders",
            JSON.stringify(oldOrders)
        );


        /* حفظ آخر طلب */

        localStorage.setItem(
            "last_order",
            JSON.stringify(order)
        );


        /* إفراغ السلة */

        localStorage.removeItem(
            "albaraka_cart"
        );

        localStorage.removeItem(
            "shopping_cart"
        );

        localStorage.removeItem(
            "cart"
        );

        sessionStorage.removeItem(
            "checkout_cart"
        );


        /* إظهار نجاح */

        document
            .getElementById("orderPage")
            .style.display = "none";


        document
            .getElementById("success")
            .style.display = "block";


        document
            .getElementById("orderNumber")
            .textContent =
            orderNumber;

    });


/* =====================================================
   رسالة الخطأ
===================================================== */

function showError(message){

    const error =
        document.getElementById("error");

    error.textContent =
        message;

    error.style.display =
        "block";

}


/* =====================================================
   حماية النص
===================================================== */

function escapeHTML(value){

    return String(value)

        .replace(/&/g,"&amp;")

        .replace(/</g,"&lt;")

        .replace(/>/g,"&gt;")

        .replace(/"/g,"&quot;")

        .replace(/'/g,"&#039;");

}


/* =====================================================
   تشغيل الصفحة
===================================================== */

document.addEventListener(
    "DOMContentLoaded",
    function(){

        renderOrder();

    }
);

</script>


</body>

</html>
