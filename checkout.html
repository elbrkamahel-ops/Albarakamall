<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>إتمام الطلب - مول البركة</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Tahoma, sans-serif;
      background: #f5f6f7;
      color: #222;
    }

    .header {
      background: #fff;
      padding: 18px;
      text-align: center;
      box-shadow: 0 2px 10px rgba(0,0,0,.08);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .header h1 {
      margin: 0;
      color: #168a45;
      font-size: 25px;
    }

    .header p {
      margin: 6px 0 0;
      color: #777;
    }

    .container {
      width: 94%;
      max-width: 850px;
      margin: 25px auto;
    }

    .box {
      background: white;
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 18px;
      box-shadow: 0 4px 18px rgba(0,0,0,.07);
    }

    .box h2 {
      margin-top: 0;
      font-size: 20px;
      color: #168a45;
    }

    label {
      display: block;
      margin: 13px 0 7px;
      font-weight: bold;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 12px;
      font-size: 16px;
      outline: none;
      background: #fff;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: #168a45;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    .products {
      margin-top: 10px;
    }

    .product {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 13px 0;
      border-bottom: 1px solid #eee;
    }

    .product:last-child {
      border-bottom: 0;
    }

    .product-name {
      font-weight: bold;
    }

    .product-info {
      color: #777;
      font-size: 14px;
      margin-top: 4px;
    }

    .price {
      font-weight: bold;
      white-space: nowrap;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      padding: 9px 0;
      font-size: 16px;
    }

    .total {
      border-top: 2px solid #eee;
      margin-top: 8px;
      padding-top: 15px;
      font-size: 22px;
      font-weight: bold;
      color: #168a45;
    }

    .submit-btn {
      width: 100%;
      border: 0;
      border-radius: 14px;
      padding: 17px;
      background: #168a45;
      color: white;
      font-size: 19px;
      font-weight: bold;
      cursor: pointer;
    }

    .submit-btn:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .back-btn {
      display: block;
      text-align: center;
      text-decoration: none;
      margin-top: 15px;
      padding: 14px;
      border-radius: 12px;
      background: #eee;
      color: #333;
    }

    .empty {
      text-align: center;
      padding: 30px 10px;
      color: #777;
    }

    .message {
      display: none;
      text-align: center;
      background: #e8f8ee;
      border: 1px solid #a9dfbd;
      color: #147a3e;
      border-radius: 16px;
      padding: 25px;
      margin-bottom: 20px;
    }

    .message h2 {
      margin-top: 0;
    }

    .order-number {
      font-size: 22px;
      font-weight: bold;
      margin: 15px 0;
    }

    .error {
      display: none;
      background: #ffecec;
      color: #b00020;
      padding: 14px;
      border-radius: 12px;
      margin-bottom: 15px;
    }

    .loading {
      text-align: center;
      padding: 25px;
      color: #777;
    }
  </style>
</head>

<body>

  <div class="header">
    <h1>مول البركة</h1>
    <p>إتمام الطلب</p>
  </div>

  <div class="container">

    <div id="successMessage" class="message">
      <h2>✅ تم استلام طلبك بنجاح</h2>

      <p>شكراً لتسوقك من مول البركة</p>

      <div class="order-number">
        رقم الطلب:
        <span id="successOrderNumber"></span>
      </div>

      <p>
        سيتم التواصل معك على رقم الهاتف لتأكيد الطلب.
      </p>

      <a href="index.html" class="back-btn">
        العودة للمتجر
      </a>
    </div>

    <div id="errorMessage" class="error"></div>

    <div id="loading" class="loading">
      جاري تحميل السلة...
    </div>

    <div id="checkoutContent" style="display:none;">

      <!-- بيانات العميل -->
      <div class="box">

        <h2>بيانات التوصيل</h2>

        <label for="customerName">
          الاسم بالكامل
        </label>

        <input
          id="customerName"
          type="text"
          placeholder="اكتب اسمك بالكامل"
          autocomplete="name"
        >

        <label for="customerPhone">
          رقم الهاتف
        </label>

        <input
          id="customerPhone"
          type="tel"
          placeholder="مثال: 011xxxxxxxx"
          autocomplete="tel"
        >

        <label for="customerAddress">
          العنوان بالتفصيل
        </label>

        <textarea
          id="customerAddress"
          placeholder="الشارع - المنطقة - رقم المنزل"
          autocomplete="street-address"
        ></textarea>

        <label for="paymentMethod">
          طريقة الدفع
        </label>

        <select id="paymentMethod">
          <option value="cash">
            الدفع عند الاستلام
          </option>

          <option value="card">
            بطاقة / دفع إلكتروني
          </option>
        </select>

        <label for="notes">
          ملاحظات الطلب
        </label>

        <textarea
          id="notes"
          placeholder="أي ملاحظات خاصة بالطلب (اختياري)"
        ></textarea>

      </div>


      <!-- المنتجات -->
      <div class="box">

        <h2>مراجعة الطلب</h2>

        <div id="products" class="products"></div>

      </div>


      <!-- الحساب -->
      <div class="box">

        <h2>ملخص الطلب</h2>

        <div class="summary-row">
          <span>إجمالي المنتجات</span>
          <strong id="subtotal">0 جنيه</strong>
        </div>

        <div class="summary-row">
          <span>التوصيل</span>
          <strong id="deliveryFee">0 جنيه</strong>
        </div>

        <div class="summary-row total">
          <span>الإجمالي</span>
          <strong id="total">0 جنيه</strong>
        </div>

      </div>


      <!-- إتمام الطلب -->
      <div class="box">

        <button
          id="submitOrder"
          class="submit-btn"
          type="button"
        >
          تأكيد وإتمام الطلب
        </button>

        <a href="cart.html" class="back-btn">
          العودة إلى السلة
        </a>

      </div>

    </div>

  </div>


  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- ملف Supabase الموجود عندك -->
  <script src="supabase.js"></script>


  <script>

    /*
    =====================================================
    مول البركة - CHECKOUT
    =====================================================
    */

    let cart = [];

    let subtotal = 0;

    let deliveryFee = 0;

    let total = 0;


    /*
    -----------------------------------------------------
    العثور على Supabase Client
    -----------------------------------------------------
    */

    function getSupabaseClient() {

      if (window.supabaseClient) {
        return window.supabaseClient;
      }

      if (
        window.supabase &&
        typeof window.supabase.from === "function"
      ) {
        return window.supabase;
      }

      return null;
    }


    const supabaseClient = getSupabaseClient();


    /*
    -----------------------------------------------------
    قراءة السلة
    -----------------------------------------------------
    */

    function getCart() {

      const possibleKeys = [
        "cart",
        "shoppingCart",
        "albarakaCart",
        "AlbarakaCart"
      ];

      for (const key of possibleKeys) {

        try {

          const value = localStorage.getItem(key);

          if (!value) continue;

          const parsed = JSON.parse(value);

          if (Array.isArray(parsed) && parsed.length > 0) {
            return parsed;
          }

        } catch (error) {

          console.log(
            "Cart read error:",
            error
          );

        }

      }

      return [];
    }


    /*
    -----------------------------------------------------
    استخراج اسم المنتج
    -----------------------------------------------------
    */

    function getProductName(item) {

      return (
        item.product_name ||
        item.name ||
        item.title ||
        item.productName ||
        "منتج"
      );

    }


    /*
    -----------------------------------------------------
    استخراج السعر
    -----------------------------------------------------
    */

    function getProductPrice(item) {

      const price =
        item.price ??
        item.product_price ??
        item.sale_price ??
        0;

      return Number(price) || 0;

    }


    /*
    -----------------------------------------------------
    استخراج الكمية
    -----------------------------------------------------
    */

    function getProductQuantity(item) {

      const quantity =
        item.quantity ??
        item.qty ??
        item.count ??
        1;

      return Math.max(
        1,
        Number(quantity) || 1
      );

    }


    /*
    -----------------------------------------------------
    استخراج ID
    -----------------------------------------------------
    */

    function getProductId(item) {

      return String(
        item.product_id ??
        item.id ??
        item.productId ??
        ""
      );

    }


    /*
    -----------------------------------------------------
    عرض السلة
    -----------------------------------------------------
    */

    function renderCart() {

      const productsElement =
        document.getElementById("products");

      productsElement.innerHTML = "";

      subtotal = 0;


      if (!cart.length) {

        productsElement.innerHTML = `
          <div class="empty">
            السلة فارغة
          </div>
        `;

        document.getElementById(
          "checkoutContent"
        ).style.display = "none";

        document.getElementById(
          "loading"
        ).style.display = "none";

        return;

      }


      cart.forEach(item => {

        const name =
          getProductName(item);

        const price =
          getProductPrice(item);

        const quantity =
          getProductQuantity(item);

        const itemTotal =
          price * quantity;

        subtotal += itemTotal;


        const row =
          document.createElement("div");

        row.className = "product";


        row.innerHTML = `

          <div>

            <div class="product-name">
              ${escapeHtml(name)}
            </div>

            <div class="product-info">
              الكمية: ${quantity}
            </div>

          </div>

          <div class="price">
            ${formatMoney(itemTotal)} جنيه
          </div>

        `;


        productsElement.appendChild(row);

      });


      /*
      ---------------------------------------------
      رسوم التوصيل
      ---------------------------------------------
      */

      deliveryFee =
        subtotal >= 300
          ? 0
          : 20;


      total =
        subtotal + deliveryFee;


      document.getElementById(
        "subtotal"
      ).textContent =
        formatMoney(subtotal) + " جنيه";


      document.getElementById(
        "deliveryFee"
      ).textContent =
        deliveryFee === 0
          ? "مجاني"
          : formatMoney(deliveryFee) + " جنيه";


      document.getElementById(
        "total"
      ).textContent =
        formatMoney(total) + " جنيه";


      document.getElementById(
        "loading"
      ).style.display = "none";


      document.getElementById(
        "checkoutContent"
      ).style.display = "block";

    }


    /*
    -----------------------------------------------------
    رقم الطلب
    -----------------------------------------------------
    */

    function generateOrderNumber() {

      const now = new Date();

      const year =
        now.getFullYear();

      const month =
        String(
          now.getMonth() + 1
        ).padStart(2, "0");

      const day =
        String(
          now.getDate()
        ).padStart(2, "0");

      const random =
        Math.floor(
          1000 + Math.random() * 9000
        );

      return `ALB-${year}${month}${day}-${random}`;

    }


    /*
    -----------------------------------------------------
    إرسال الطلب
    -----------------------------------------------------
    */

    async function submitOrder() {

      const button =
        document.getElementById(
          "submitOrder"
        );


      const errorBox =
        document.getElementById(
          "errorMessage"
