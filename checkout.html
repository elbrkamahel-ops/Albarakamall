<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>إتمام الطلب - مول البركة</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Tahoma,Arial,sans-serif;
    background:#f5fff7;
    color:#222;
}

header{
    background:linear-gradient(135deg,#087d27,#10aa3b);
    color:#fff;
    padding:18px 5%;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-size:25px;
    font-weight:900;
}

.back{
    color:#fff;
    text-decoration:none;
    background:rgba(255,255,255,.18);
    padding:12px 18px;
    border-radius:14px;
    font-weight:bold;
}

main{
    width:94%;
    max-width:1050px;
    margin:35px auto;
}

h1{
    text-align:center;
    color:#087d27;
    margin-bottom:30px;
}

.grid{
    display:grid;
    grid-template-columns:1.3fr .7fr;
    gap:22px;
}

.box{
    background:#fff;
    padding:25px;
    border-radius:22px;
    box-shadow:0 8px 30px rgba(0,0,0,.07);
}

h2{
    color:#087d27;
    margin-top:0;
}

label{
    display:block;
    font-weight:bold;
    margin:15px 0 7px;
}

input,textarea{
    width:100%;
    padding:15px;
    border:1px solid #dce6df;
    border-radius:13px;
    font-family:inherit;
    font-size:16px;
    outline:none;
}

textarea{
    min-height:110px;
    resize:vertical;
}

input:focus,textarea:focus{
    border-color:#07872a;
}

.payment{
    background:#f6fff8;
    padding:15px;
    border-radius:13px;
    margin-top:10px;
}

.payment input{
    width:auto;
}

button{
    width:100%;
    border:0;
    padding:17px;
    margin-top:20px;
    border-radius:15px;
    background:linear-gradient(135deg,#087d27,#10aa3b);
    color:white;
    font-size:18px;
    font-weight:900;
    cursor:pointer;
}

button:disabled{
    opacity:.6;
}

.message{
    display:none;
    padding:16px;
    margin-bottom:20px;
    border-radius:14px;
    font-weight:bold;
}

.error{
    display:block;
    background:#fff0f0;
    color:#a00000;
}

.success{
    display:block;
    background:#edfff2;
    color:#087d27;
}

.product{
    display:flex;
    justify-content:space-between;
    gap:10px;
    padding:13px 0;
    border-bottom:1px solid #eee;
}

.product-name{
    font-weight:bold;
}

.product small{
    color:#777;
}

.price{
    color:#087d27;
    font-weight:bold;
    white-space:nowrap;
}

.total{
    display:flex;
    justify-content:space-between;
    font-size:20px;
    font-weight:900;
    color:#087d27;
    margin-top:20px;
    padding-top:17px;
    border-top:2px solid #eee;
}

#successScreen{
    display:none;
    text-align:center;
}

.successIcon{
    font-size:70px;
    margin-bottom:15px;
}

.orderNumber{
    margin:25px auto;
    max-width:400px;
    background:#f1fff4;
    border:1px solid #ccebd5;
    border-radius:18px;
    padding:20px;
}

.orderNumber span{
    display:block;
    color:#777;
    margin-bottom:8px;
}

.orderNumber strong{
    display:block;
    color:#087d27;
    font-size:27px;
    direction:ltr;
}

.successButtons{
    display:flex;
    justify-content:center;
    gap:12px;
    flex-wrap:wrap;
    margin-top:25px;
}

.successButtons a{
    text-decoration:none;
    padding:14px 22px;
    border-radius:14px;
    font-weight:bold;
}

.shop{
    background:#087d27;
    color:#fff;
}

.newOrder{
    background:#eef7f0;
    color:#087d27;
}

@media(max-width:800px){

    .grid{
        grid-template-columns:1fr;
    }

    header{
        padding:15px 4%;
    }

    .logo{
        font-size:20px;
    }

    .back{
        padding:10px 12px;
        font-size:13px;
    }

    .box{
        padding:20px;
    }
}
</style>
</head>

<body>

<header>

    <div class="logo">
        🛒 مول البركة
    </div>

    <a href="cart.html" class="back">
        ← السلة
    </a>

</header>


<main>

<h1>
    إتمام الطلب
</h1>


<div id="message" class="message"></div>


<!-- =========================
     صفحة الطلب
========================= -->

<div id="checkoutScreen">

<div class="grid">


<!-- بيانات العميل -->

<div class="box">

<h2>
    📋 بيانات العميل
</h2>

<form id="checkoutForm">

<label>
    الاسم بالكامل *
</label>

<input
    id="name"
    type="text"
    placeholder="الاسم بالكامل"
    required>


<label>
    رقم الهاتف *
</label>

<input
    id="phone"
    type="tel"
    inputmode="tel"
    placeholder="011xxxxxxxx"
    required>


<label>
    العنوان بالتفصيل *
</label>

<textarea
    id="address"
    placeholder="المنطقة - الشارع - رقم المنزل - علامة مميزة"
    required></textarea>


<label>
    طريقة الدفع
</label>

<div class="payment">

<input
    type="radio"
    name="payment"
    value="cash"
    checked>

الدفع عند الاستلام 💵

</div>


<label>
    ملاحظات الطلب
</label>

<textarea
    id="notes"
    placeholder="أي ملاحظات خاصة بالطلب"></textarea>


<button
    id="submitButton"
    type="submit">

    تأكيد الطلب

</button>

</form>

</div>


<!-- ملخص الطلب -->

<div class="box">

<h2>
    🧾 ملخص الطلب
</h2>

<div id="products">
    جاري تحميل السلة...
</div>

<div class="total">

<span>
    الإجمالي
</span>

<span>
    <span id="total">0.00</span>
    جنيه
</span>

</div>

</div>

</div>

</div>


<!-- =========================
     شاشة النجاح
========================= -->

<div id="successScreen" class="box">

<div class="successIcon">
    ✅
</div>

<h2>
    تم تسجيل طلبك بنجاح
</h2>

<p>
    شكرًا لثقتك في مول البركة ❤️
</p>


<div class="orderNumber">

<span>
    رقم الطلب
</span>

<strong id="orderNumber">
    -
</strong>

</div>


<div>
    إجمالي الطلب:
    <strong
        id="successTotal"
        style="color:#087d27">
        0.00 جنيه
    </strong>
</div>


<div class="successButtons">

<a
    href="index.html"
    class="shop">

    🛍️ العودة للمتجر

</a>

<a
    href="cart.html"
    class="newOrder">

    🛒 طلب جديد

</a>

</div>

</div>

</main>


<script>

/* =====================================================
   إعداد Supabase
===================================================== */

const SUPABASE_URL =
    "ضع_رابط_مشروعك_هنا";

const SUPABASE_KEY =
    "ضع_مفتاح_Publishable_أو_Anon_هنا";


/* =====================================================
   الاتصال
===================================================== */

let supabaseClient = null;

try{

    if(
        SUPABASE_URL &&
        SUPABASE_KEY &&
        !SUPABASE_URL.includes("ضع_") &&
        !SUPABASE_KEY.includes("ضع_")
    ){

        supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );

    }

}catch(error){

    console.error(error);

}


/* =====================================================
   العناصر
===================================================== */

const form =
    document.getElementById(
        "checkoutForm"
    );

const productsBox =
    document.getElementById(
        "products"
    );

const totalBox =
    document.getElementById(
        "total"
    );

const messageBox =
    document.getElementById(
        "message"
    );

const submitButton =
    document.getElementById(
        "submitButton"
    );

const checkoutScreen =
    document.getElementById(
        "checkoutScreen"
    );

const successScreen =
    document.getElementById(
        "successScreen"
    );


/* =====================================================
   الرسائل
===================================================== */

function message(text,type){

    messageBox.className =
        "message " + type;

    messageBox.textContent =
        text;

    messageBox.style.display =
        "block";

}


/* =====================================================
   قراءة السلة
===================================================== */

function loadCart(){

    const possibleKeys = [

        "cart",
        "albaraka_cart",
        "shopping_cart",
        "AlBarakaCart",
        "cartItems"

    ];

    for(
        const key of possibleKeys
    ){

        try{

            const raw =
                localStorage.getItem(key);

            if(!raw){
                continue;
            }

            const data =
                JSON.parse(raw);

            if(
                Array.isArray(data) &&
                data.length
            ){

                return data;

            }

            if(
                data &&
                Array.isArray(data.items) &&
                data.items.length
            ){

                return data.items;

            }

        }catch(error){

            console.log(error);

        }

    }

    return [];

}


/* =====================================================
   توحيد المنتجات
===================================================== */

function normalize(item){

    return {

        id:
            item.id ??
            item.product_id ??
            item.productId ??
            null,

        name:
            item.name ??
            item.title ??
            item.product_name ??
            "منتج",

        price:
            Number(
                item.price ??
                item.sale_price ??
                item.unit_price ??
                0
            ),

        quantity:
            Math.max(
                1,
                Number(
                    item.quantity ??
                    item.qty ??
                    1
                )
            )

    };

}


let cart =
    loadCart().map(normalize);


/* =====================================================
   عرض السلة
===================================================== */

function renderCart(){

    if(!cart.length){

        productsBox.innerHTML =
            "<p>السلة فارغة.</p>";

        submitButton.disabled =
            true;

        return;

    }


    productsBox.innerHTML =
        "";

    let total =
        0;


    cart.forEach(function(item){

        const line =
            item.price *
            item.quantity;

        total += line;


        const div =
            document.createElement(
                "div"
            );

        div.className =
            "product";


        div.innerHTML = `

            <div>

                <div class="product-name">
                    ${escapeHTML(item.name)}
                </div>

                <small>
                    الكمية: ${item.quantity}
                </small>

            </div>

            <div class="price">
                ${line.toFixed(2)} جنيه
            </div>

        `;


        productsBox.appendChild(div);

    });


    totalBox.textContent =
        total.toFixed(2);

}


/* =====================================================
   حماية النص
===================================================== */

function escapeHTML(value){

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =====================================================
   رقم الطلب
===================================================== */

function createOrderNumber(){

    return (
        "BRK-" +
        Date.now()
        .toString()
        .slice(-8) +
        "-" +
        Math.floor(
            100 +
            Math.random()*900
        )
    );

}


/* =====================================================
   الهاتف
===================================================== */

function validPhone(phone){

    const value =
        phone.replace(
            /[\s\-()+]/g,
            ""
        );

    return /^01[0125][0-9]{8}$/
        .test(value);

}


/* =====================================================
   إرسال الطلب
===================================================== */

form.addEventListener(
    "submit",
    async function(event){

        /*
        أهم سطر:
        منع إعادة تحميل الصفحة
        */

        event.preventDefault();

        event.stopPropagation();


        messageBox.style.display =
            "none";


        /*
        إعادة قراءة السلة
        */

        cart =
            loadCart().map(normalize);


        if(!cart.length){

            message(
                "السلة فارغة.",
                "error"
            );

            return;

        }


        /*
        بيانات العميل
        */

        const name =
            document
            .getElementById("name")
            .value
            .trim();

        const phone =
            document
            .getElementById("phone")
            .value
            .trim();

        const address =
            document
            .getElementById("address")
            .value
            .trim();

        const notes =
            document
            .getElementById("notes")
            .value
            .trim();


        if(name.length < 3){

            message(
                "اكتب الاسم بالكامل.",
                "error"
            );

            return;

        }


        if(!validPhone(phone)){

            message(
                "رقم الهاتف غير صحيح.",
                "error"
            );

            return;

        }


        if(address.length < 5){

            message(
                "اكتب العنوان بالتفصيل.",
                "error"
            );

            return;

        }


        /*
        التحقق من Supabase
        */

        if(!supabaseClient){

            message(
                "لم يتم إعداد بيانات Supabase داخل الصفحة.",
                "error"
            );

            return;

        }


        submitButton.disabled =
            true;

        submitButton.textContent =
            "جاري تسجيل الطلب...";


        try{

            /*
            حساب الإجمالي
            */

            let total =
                0;

            cart.forEach(function(item){

                total +=
                    item.price *
                    item.quantity;

            });


            /*
            رقم الطلب
            */

            const number =
                createOrderNumber();


            /*
            إنشاء الطلب
            */

            const orderData = {

                order_number:
                    number,

                customer_name:
                    name,

                customer_phone:
                    phone,

                customer_address:
                    address,

                payment_method:
                    "cash",

                notes:
                    notes || null,

                subtotal:
                    total,

                total:
                    total,

                status:
                    "pending"

            };


            const {
                data: order,
                error: orderError
            } =
                await supabaseClient
                .from("orders")
                .insert(orderData)
                .select()
                .single();


            if(orderError){

                throw orderError;

            }


            if(
                !order ||
                !order.id
            ){

                throw new Error(
                    "لم يتم الحصول على رقم الطلب."
                );

            }


            /*
            تفاصيل المنتجات
            */

            const items =
                cart.map(function(item){

                    return {

                        order_id:
                            order.id,

                        product_id:
                            item.id,

                        product_name:
                            item.name,

                        quantity:
                            item.quantity,

                        price:
                            item.price,

                        total:
                            item.price *
                            item.quantity

                    };

                });


            const {
                error: itemError
            } =
                await supabaseClient
                .from("order_items")
                .insert(items);


            if(itemError){

                throw itemError;

            }


            /*
            حفظ الطلب الأخير
            */

            localStorage.setItem(
                "albaraka_last_order",
                JSON.stringify({

                    id:
                        order.id,

                    order_number:
                        number,

                    total:
                        total,

                    customer_name:
                        name,

                    customer_phone:
                        phone

                })
            );


            /*
            مسح السلة
            */

            [
                "cart",
                "albaraka_cart",
                "shopping_cart",
                "AlBarakaCart",
                "cartItems"

            ].forEach(function(key){

                localStorage.removeItem(key);

            });


            /*
            =========================================
            النجاح
            =========================================

            لا يوجد reload
            لا يوجد location
            لا يوجد submit
            لا يوجد redirect
            */

            checkoutScreen.style.display =
                "none";

            successScreen.style.display =
                "block";


            document.getElementById(
                "orderNumber"
            ).textContent =
                number;


            document.getElementById(
                "successTotal"
            ).textContent =
                total.toFixed(2) +
                " جنيه";


            message(
                "تم تسجيل الطلب بنجاح ✅",
                "success"
            );


            window.scrollTo({
                top:0,
                behavior:"smooth"
            });


        }catch(error){

            console.error(
                "SUPABASE ERROR:",
                error
            );


            message(
                "تعذر تسجيل الطلب: " +
                (
                    error.message ||
                    "خطأ غير معروف"
                ),
                "error"
            );


        }finally{

            submitButton.disabled =
                false;

            submitButton.textContent =
                "تأكيد الطلب";

        }

    }
);


/* =====================================================
   تشغيل
===================================================== */

renderCart();

</script>

</body>
</html>
