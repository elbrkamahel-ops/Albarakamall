<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>إتمام الطلب | مول البركة</title>

  <!-- خط عربي -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --green: #087f3f;
      --green-dark: #056631;
      --green-light: #eaf8f0;
      --orange: #f59e0b;
      --red: #dc2626;
      --text: #17231c;
      --muted: #718096;
      --border: #e5e7eb;
      --bg: #f5f7f6;
      --white: #ffffff;
      --shadow: 0 12px 35px rgba(0,0,0,.07);
    }

    body {
      font-family: "Cairo", sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    button,
    input,
    textarea,
    select {
      font-family: inherit;
    }

    .topbar {
      background: linear-gradient(135deg, #087f3f, #056631);
      color: white;
      padding: 18px 20px;
      box-shadow: 0 4px 20px rgba(0,0,0,.12);
    }

    .topbar-inner {
      max-width: 1200px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-logo {
      width: 48px;
      height: 48px;
      background: white;
      border-radius: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--green);
      font-size: 25px;
      font-weight: 900;
    }

    .brand-text strong {
      display: block;
      font-size: 21px;
      font-weight: 900;
    }

    .brand-text span {
      font-size: 12px;
      opacity: .85;
    }

    .secure {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 13px;
      background: rgba(255,255,255,.12);
      padding: 8px 13px;
      border-radius: 30px;
    }

    .page {
      max-width: 1200px;
      margin: 30px auto;
      padding: 0 18px 60px;
    }

    .page-title {
      margin-bottom: 25px;
    }

    .page-title h1 {
      font-size: 30px;
      font-weight: 900;
      color: #153c27;
    }

    .page-title p {
      color: var(--muted);
      margin-top: 5px;
      font-size: 14px;
    }

    .checkout-grid {
      display: grid;
      grid-template-columns: 1.5fr .9fr;
      gap: 25px;
      align-items: start;
    }

    .card {
      background: white;
      border-radius: 24px;
      box-shadow: var(--shadow);
      border: 1px solid rgba(0,0,0,.04);
      overflow: hidden;
    }

    .card-head {
      padding: 22px 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 13px;
    }

    .icon {
      width: 43px;
      height: 43px;
      border-radius: 14px;
      background: var(--green-light);
      color: var(--green);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 21px;
    }

    .card-head h2 {
      font-size: 18px;
      font-weight: 900;
    }

    .card-head p {
      color: var(--muted);
      font-size: 12px;
      margin-top: 2px;
    }

    .card-body {
      padding: 24px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }

    .field {
      margin-bottom: 17px;
    }

    .field.full {
      grid-column: 1 / -1;
    }

    label {
      display: block;
      font-weight: 800;
      font-size: 13px;
      margin-bottom: 8px;
    }

    label span {
      color: var(--red);
    }

    input,
    textarea,
    select {
      width: 100%;
      border: 1.5px solid #dfe5e1;
      border-radius: 14px;
      padding: 14px 15px;
      font-size: 14px;
      outline: none;
      background: #fff;
      color: #18251d;
      transition: .2s;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: var(--green);
      box-shadow: 0 0 0 4px rgba(8,127,63,.09);
    }

    textarea {
      min-height: 110px;
      resize: vertical;
    }

    .payment-options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .payment-option {
      position: relative;
    }

    .payment-option input {
      display: none;
    }

    .payment-label {
      border: 1.5px solid var(--border);
      border-radius: 16px;
      padding: 15px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: .2s;
      background: #fff;
    }

    .payment-label .payment-icon {
      font-size: 22px;
    }

    .payment-label strong {
      display: block;
      font-size: 13px;
    }

    .payment-label small {
      color: var(--muted);
      font-size: 10px;
    }

    .payment-option input:checked + .payment-label {
      border-color: var(--green);
      background: var(--green-light);
      box-shadow: 0 0 0 2px rgba(8,127,63,.08);
    }

    .summary {
      position: sticky;
      top: 20px;
    }

    .summary-body {
      padding: 22px;
    }

    .cart-items {
      max-height: 350px;
      overflow-y: auto;
      margin-bottom: 18px;
    }

    .cart-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid #edf0ee;
    }

    .cart-item:last-child {
      border-bottom: none;
    }

    .item-image {
      width: 57px;
      height: 57px;
      border-radius: 13px;
      background: #f0f5f2;
      object-fit: cover;
      flex-shrink: 0;
    }

    .item-info {
      flex: 1;
      min-width: 0;
    }

    .item-name {
      font-size: 13px;
      font-weight: 800;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .item-meta {
      color: var(--muted);
      font-size: 11px;
      margin-top: 3px;
    }

    .item-price {
      font-size: 13px;
      font-weight: 900;
      color: var(--green);
      white-space: nowrap;
    }

    .empty {
      text-align: center;
      padding: 40px 10px;
      color: var(--muted);
    }

    .empty-icon {
      font-size: 45px;
      margin-bottom: 10px;
    }

    .line {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      padding: 8px 0;
      font-size: 14px;
    }

    .line span:first-child {
      color: #66736b;
    }

    .line strong {
      font-weight: 900;
    }

    .delivery {
      color: var(--green) !important;
    }

    .total-box {
      background: linear-gradient(135deg, #edf9f2, #e2f5ea);
      border-radius: 18px;
      padding: 18px;
      margin-top: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .total-box span {
      font-weight: 800;
      color: #38604a;
    }

    .total-box strong {
      color: var(--green-dark);
      font-size: 25px;
      font-weight: 900;
    }

    .submit-btn {
      width: 100%;
      border: none;
      background: linear-gradient(135deg, #0b8b48, #056631);
      color: white;
      border-radius: 17px;
      padding: 17px;
      margin-top: 18px;
      font-size: 16px;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(8,127,63,.22);
      transition: .2s;
    }

    .submit-btn:hover {
      transform: translateY(-1px);
    }

    .submit-btn:disabled {
      opacity: .65;
      cursor: not-allowed;
      transform: none;
    }

    .back-btn {
      width: 100%;
      border: 1px solid var(--border);
      background: white;
      color: #34423a;
      border-radius: 15px;
      padding: 13px;
      margin-top: 10px;
      font-weight: 800;
      cursor: pointer;
    }

    .security-note {
      text-align: center;
      color: var(--muted);
      font-size: 11px;
      margin-top: 13px;
    }

    .message {
      display: none;
      border-radius: 15px;
      padding: 15px;
      margin-bottom: 18px;
      font-size: 13px;
      font-weight: 800;
    }

    .message.error {
      display: block;
      background: #fff0f0;
      color: #b42318;
      border: 1px solid #ffd1d1;
    }

    .message.success {
      display: block;
      background: #ecfdf3;
      color: #067647;
      border: 1px solid #b7ebca;
    }

    .loading {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
    }

    .spinner {
      width: 19px;
      height: 19px;
      border: 3px solid rgba(255,255,255,.4);
      border-top-color: white;
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .success-page {
      display: none;
      text-align: center;
      padding: 45px 25px;
    }

    .success-circle {
      width: 90px;
      height: 90px;
      margin: auto auto 20px;
      border-radius: 50%;
      background: #e8f8ee;
      color: var(--green);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 45px;
    }

    .success-page h2 {
      font-size: 26px;
      font-weight: 900;
      color: var(--green-dark);
    }

    .order-number {
      background: #f4f7f5;
      border-radius: 14px;
      padding: 13px;
      margin: 18px 0;
      font-weight: 900;
    }
