<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#087f23">

    <title>إتمام الطلب | مول البركة</title>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- ملف اتصال Supabase الموجود عندك -->
    <script src="./supabase.js"></script>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Tahoma, Arial, sans-serif;
            background:
                linear-gradient(135deg, #f3fff5, #ffffff);
            color: #222;
            min-height: 100vh;
        }

        header {
            background:
                linear-gradient(135deg, #087f23, #10a83b);
            color: white;
            padding: 18px 5%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 20px rgba(0,0,0,.12);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 25px;
            font-weight: 900;
        }

        .logo small {
            display: block;
            font-size: 13px;
            margin-top: 5px;
            opacity: .9;
        }

        .back {
            color: white;
            text-decoration: none;
            background: rgba(255,255,255,.16);
            padding: 12px 18px;
            border-radius: 14px;
            font-weight: bold;
        }

        main {
            width: min(1100px, 94%);
            margin: 32px auto 70px;
        }

        .page-title {
            text-align: center;
            margin-bottom: 28px;
        }

        .page-title h1 {
            color: #087f23;
            font-size: 32px;
            margin-bottom: 10px;
        }

        .page-title p {
            color: #777;
            font-size: 17px;
        }

        .checkout-grid {
            display: grid;
            grid-template-columns: 1.4fr .8fr;
            gap: 22px;
            align-items: start;
        }

        .card {
            background: white;
            border-radius: 22px;
            padding: 25px;
            box-shadow:
                0 8px 35px rgba(0,0,0,.07);
            border: 1px solid #edf2ee;
        }

        .card h2 {
            color: #087f23;
            font-size: 21px;
            margin-bottom: 22px;
        }

        .field {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 9px;
            font-size: 15px;
        }

        .required {
            color: #d00000;
        }

        input,
        textarea,
        select {
            width: 100%;
            border: 1px solid #dce5df;
            border-radius: 14px;
            padding: 15px;
            font-family: inherit;
            font-size: 16px;
            outline: none;
            background: #fbfdfb;
            transition: .2s;
        }

        input:focus,
        textarea:focus,
        select:focus {
            border-color: #0b982e;
            background: white;
            box-shadow:
                0 0 0 3px rgba(11,152,46,.08);
        }

        textarea {
            min-height: 110px;
            resize: vertical;
        }

        .payment-box {
            display: grid;
            gap: 10px;
        }

        .payment-option {
            display: flex;
            align-items: center;
            gap: 10px;
            border: 1px solid #dfe8e1;
            border-radius: 14px;
            padding: 15px;
            cursor: pointer;
            background: #fbfdfb;
        }

        .payment-option input {
            width: auto;
        }

        .order-list {
            display: grid;
            gap: 12px;
        }

        .product {
            display: flex;
            align-items: center;
            gap: 12px;
            padding-bottom: 13px;
            border-bottom: 1px solid #edf0ed;
        }

        .product:last-child {
            border-bottom: 0;
        }

        .product-image {
            width: 65px;
            height: 65px;
            border-radius: 13px;
            object-fit: cover;
            background: #f2f2f2;
            flex-shrink: 0;
        }

        .product-info {
            flex: 1;
            min-width: 0;
        }

        .product-name {
            font-weight: bold;
            margin-bottom: 5px;
            line-height: 1.5;
        }

        .product-meta {
            color: #777;
            font-size: 13px;
        }

        .product-price {
            color: #087f23;
            font-weight: bold;
            white-space: nowrap;
        }

        .summary {
            margin-top: 20px;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            padding: 11px 0;
            color: #555;
        }

        .summary-row.total {
            border-top: 2px solid #e9eee9;
            margin-top: 8px;
            padding-top: 17px;
            color: #087f23;
            font-size: 21px;
            font-weight: 900;
        }

        .submit-btn {
            width: 100%;
            border: 0;
            padding: 17px;
            margin-top: 12px;
            border-radius: 15px;
            background:
                linear-gradient(135deg, #087f23, #13a93d);
            color: white;
            font-family: inherit;
            font-size: 17px;
            font-weight: 900;
            cursor: pointer;
            box-shadow:
                0 8px 22px rgba(8,127,35,.2);
            transition: .2s;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
        }

        .submit-btn:disabled {
            opacity: .65;
            cursor: not-allowed;
            transform: none;
        }

        .message {
            display: none;
            padding: 16px;
            border-radius: 15px;
            margin-bottom: 20px;
            font-weight: bold;
            line-height: 1.8;
        }

        .message.error {
            display: block;
            background: #fff0f0;
            color: #b00000;
            border: 1px solid #ffcaca;
        }

        .message.success {
            display: block;
            background: #effff2;
            color: #087f23;
            border: 1px solid #bdebc7;
        }

        .empty-box {
            display: none;
            text-align: center;
            background: white;
            border-radius: 22px;
            padding: 55px 20px;
            box-shadow: 0 8px 35px rgba(0,0,0,.07);
        }

        .empty-icon {
            font-size: 60px;
            margin-bottom: 15px;
        }

        .empty-box h2 {
            color: #087f23;
            margin-bottom: 10px;
        }

        .empty-box p {
            color: #666;
            line-height: 1.8;
        }

        .home-btn {
            display: inline-block;
            margin-top: 20px;
            padding: 13px 25px;
            background: #087f23;
            color: white;
            text-decoration: none;
            border-radius: 13px;
            font-weight: bold;
        }

        .secure {
            text-align: center;
            margin-top: 14px;
            color: #888;
            font-size: 12px;
        }

        .loading {
            text-align: center;
            padding: 30px 10px;
            color: #777;
        }

        .debug {
            display: none;
        }

        @media (max-width: 800px) {

            header {
                padding: 15px 4%;
            }

            .logo {
                font-size: 20px;
            }

            .back {
                padding: 10px 13px;
                font-size: 13px;
            }

            main {
                width: 94%;
                margin-top: 25px;
            }

            .page-title h1 {
                font-size: 27px;
            }

            .page-title p {
                font-size: 15px;
            }

            .checkout-grid {
                grid-template-columns: 1fr;
            }

            .card {
                padding: 19px;
                border-radius: 18px;
            }

            .card h2 {
                font-size: 20px;
            }
        }

    </style>

</head>

<body>

<header>

    <div class="logo">
        🛒 مول البركة
        <small>أولاد الجارحي</small>
    </div>

    <a href="cart.html" class="back">
        ← العودة للسلة
    </a>

</header>


<main>

    <div class="page-title">

        <h1>إتمام الطلب</h1>

        <p>
            أدخل بياناتك وسنجهز طلبك بكل عناية
        </p>

    </div>


    <div id="message"
