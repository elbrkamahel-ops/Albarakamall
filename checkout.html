<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>إتمام الطلب | مول البركة</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Tahoma, Arial, sans-serif;
    }

    body {
      background: #f5f7f6;
      color: #222;
      min-height: 100vh;
    }

    header {
      background: #fff;
      padding: 22px 15px;
      text-align: center;
      box-shadow: 0 3px 15px rgba(0,0,0,.08);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .logo {
      color: #168447;
      font-size: 34px;
      font-weight: 900;
      margin-bottom: 7px;
    }

    .subtitle {
      color: #777;
      font-size: 18px;
    }

    .container {
      width: 94%;
      max-width: 1100px;
      margin: 25px auto;
    }

    .back {
      display: inline-block;
      text-decoration: none;
      color: #168447;
      background: #fff;
      border: 1px solid #ddd;
      padding: 10px 18px;
      border-radius: 12px;
      margin-bottom: 20px;
      font-weight: bold;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 420px;
      gap: 20px;
      align-items: start;
    }

    .box {
      background: #fff;
      border-radius: 20px;
      padding: 22px;
      box-shadow: 0 5px 25px rgba(0,0,0,.07);
      margin-bottom: 20px;
    }

    .box h2 {
      color: #168447;
      margin-bottom: 18px;
      font-size: 23px;
    }

    .product {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 0;
      border-bottom: 1px solid #eee;
    }

    .product:last-child {
      border-bottom: 0;
    }

    .product-img {
      width: 75px;
      height: 75px;
      border-radius: 14px;
      background: #f0f3f1;
      object-fit: cover;
      flex-shrink: 0;
    }

    .product-info {
      flex: 1;
    }

    .product-name {
      font-size: 17px;
      font-weight: bold;
      margin-bottom: 6px;
    }

    .product-price {
      color: #168447;
      font-weight: bold;
    }

    .qty {
      background: #eef7f1;
      color: #168447;
      padding: 5px 10px;
      border-radius: 8px;
      display: inline-block;
      margin-top: 6px;
      font-size: 14px;
    }

    .total-row {
      display: flex;
      justify-content: space-between;
      padding: 10px 0;
      font-size: 17px;
    }

    .total {
      border-top: 2px solid #eee;
      margin-top: 12px;
      padding-top: 18px;
      font-size: 23px;
      font-weight: bold;
      color: #168447;
    }

    label {
      display: block;
      margin: 13px 0 7px;
      font-weight: bold;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 12px;
      outline: none;
      font-size: 16px;
      background: #fff;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: #168447;
      box-shadow: 0 0 0 3px rgba(22,132,71,.1);
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    .submit {
      width: 100%;
      border: 0;
      background: #168447;
      color: #fff;
      padding: 17px;
      border-radius: 14px;
      font-size: 19px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 18px;
    }

    .submit:hover {
      background: #106b39;
    }

    .submit:disabled {
      background: #aaa;
      cursor: not-allowed;
    }

    .empty {
      text-align: center;
      padding: 55px 20px;
    }

    .empty-icon {
      font-size: 55px;
      margin-bottom: 15px;
    }

    .empty h2 {
      color: #333;
      margin-bottom: 10px;
    }

    .empty p {
      color: #777;
      margin-bottom: 20px;
    }

    .shop-btn {
      display: inline-block;
      background: #168447;
      color: #fff;
      padding: 13px 25px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: bold;
    }

    .message {
      display: none;
      padding: 15px;
      border-radius: 12px;
      margin-top: 15px;
      text-align: center;
      font-weight: bold;
    }

    .success {
      display: block;
      background: #e8f7ee;
      color: #168447;
    }

    .error {
      display: block;
      background: #ffeaea;
      color: #c62828;
    }

    .loading {
      text-align: center;
      padding: 30px;
      color: #777;
    }

    .order-number {
      font-size: 25px;
      color: #168447;
      margin: 15px 0;
    }

    @media(max-width: 800px) {
      .grid {
        grid-template-columns: 1fr;
      }

      .logo {
        font-size: 29px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="logo">مول البركة</div>
  <div class="subtitle">إتمام الطلب</div>
</header>

<div class="container">

  <a href="shop.html" class="back">← العودة للمتجر</a>

  <div id="loading" class="box loading">
    جاري تحميل السلة...
  </div>

  <div id="emptyCart" class="box empty" style="display:none;">
    <div class="empty-icon">🛒</div>
    <h2>السلة فارغة</h2>
    <p>لم تقم بإضافة أي منتجات إلى السلة بعد.</p>
    <a href="shop.html" class="shop-btn">اذهب إلى المتجر</a>
  </div>

  <div id="checkoutContent" class="grid" style="display:none;">

    <!-- المنتجات -->
    <div>

      <div class="box">
        <h2>🛒 منتجاتك</h2>
        <div id="cartItems"></div>
      </div>

      <div class="box">
        <h2>📦 بيانات التوصيل</h2>

        <form id="orderForm">

          <label>الاسم بالكامل</label>
          <input
            type="text"
            id="customerName"
            required
            placeholder="اكتب اسمك بالكامل"
          >

          <label>رقم الهاتف</label>
          <input
            type="tel"
            id="customerPhone"
            required
            placeholder="01xxxxxxxxx"
          >

          <label>العنوان بالتفصيل</label>
          <textarea
            id="customerAddress"
            required
            placeholder="اكتب العنوان بالتفصيل"
          ></textarea>

          <label>المدينة / المنطقة</label>
          <input
            type="text"
            id="customerCity"
            placeholder="المدينة أو المنطقة"
          >

          <label>طريقة الدفع</label>
          <select id="paymentMethod">
            <option value="cash">الدفع عند الاستلام</option>
          </select>

          <label>ملاحظات</label>
          <textarea
            id="notes"
            placeholder="أي ملاحظات إضافية للطلب"
          ></textarea>

          <button type="submit" id="submitBtn" class="submit">
            تأكيد الطلب
          </button>

          <div id="message" class="message"></div>

        </form>
      </div>

    </div>

    <!-- ملخص -->
    <div>

      <div class="box">

        <h2>💰 ملخص الطلب</h2>

        <div class="total-row">
          <span>إجمالي المنتجات</span>
          <strong id="subtotal">0 ج.م</strong>
        </div>

        <div class="total-row">
          <span>التوصيل</span>
          <strong id="delivery">0 ج.م</strong>
        </div>

        <div class="total-row total">
          <span>الإجمالي</span>
          <strong id="grandTotal">0 ج.م</strong>
        </div>

      </div>

    </div>

  </div>

</div>

<script>

/* =====================================================
   مول البركة
   نظام تحميل السلة - نسخة مصححة
   ===================================================== */

let cart = [];
let subtotal = 0;
let deliveryFee = 0;


/* -----------------------------------------------------
   تحويل الرقم
----------------------------------------------------- */

function numberValue(value) {

  if (typeof value === "number") {
    return value;
  }

  if (typeof value === "string") {
    value = value
      .replace(/[^\d.-]/g, "");

    const n = parseFloat(value);

    return isNaN(n) ? 0 : n;
  }

  return 0;
}


/* -----------------------------------------------------
   قراءة السلة من localStorage
----------------------------------------------------- */

function loadCart() {

  const possibleKeys = [
    "cart",
    "cartItems",
    "shoppingCart",
    "albaraka_cart",
    "AlbarakaCart",
    "productsCart"
  ];

  let found = null;

  for (const key of possibleKeys) {

    try {

      const data = localStorage.getItem(key);

      if (!data) continue;

      const parsed = JSON.parse(data);

      if (Array.isArray(parsed)) {
        found = parsed;
        break;
      }

      if (parsed && Array.isArray(parsed.items)) {
        found = parsed.items;
        break;
      }

      if (parsed && Array.isArray(parsed.cart)) {
        found = parsed.cart;
        break;
      }

    } catch (e) {
      console.log("خطأ في قراءة:", key);
    }

  }

  if (!found) {
    found = [];
  }

  cart = found.map((item, index) => {

    return {

      id:
        item.id ??
        item.product_id ??
        item.productId ??
        String(index + 1),

      name:
        item.name ??
        item.product_name ??
        item.title ??
        "منتج",

      price:
        numberValue(
          item.price ??
          item.product_price ??
          item.sale_price ??
          0
        ),

      quantity:
        parseInt(
          item.quantity ??
          item.qty ??
          item.count ??
          1
        ) || 1,

      image:
        item.image ??
        item.img ??
        item.image_url ??
        ""

    };

  });

  return cart;
}


/* -----------------------------------------------------
   حساب الإجمالي
----------------------------------------------------- */

function calculateTotals() {

  subtotal = 0;

  cart.forEach(item => {

    subtotal +=
      numberValue(item.price) *
      numberValue(item.quantity);

  });

  /*
    يمكنك تغيير سعر التوصيل هنا
    حالياً التوصيل = 0
  */

  deliveryFee = 0;

  document.getElementById("subtotal").textContent =
    subtotal.toFixed(2) + " ج.م";

  document.getElementById("delivery").textContent =
    deliveryFee.toFixed(2) + " ج.م";

  document.getElementById("grandTotal").textContent =
    (subtotal + deliveryFee).toFixed(2) + " ج.م";
}


/* -----------------------------------------------------
   عرض المنتجات
----------------------------------------------------- */

function renderCart() {

  const loading =
    document.getElementById("loading");

  const empty =
    document.getElementById("emptyCart");

  const content =
    document.getElementById("checkoutContent");

  const items =
    document.getElementById("cartItems");

  loading.style.display = "none";

  if (!cart || cart.length === 0) {

    empty.style.display = "block";
    content.style.display = "none";

    return;
  }

  empty.style.display = "none";
  content.style.display = "grid";

  items.innerHTML = "";

  cart.forEach(item => {

    const row = document.createElement("div");

    row.className = "product";

    const image =
      item.image ||
      "https://via.placeholder.com/100?text=Albaraka";

    row.innerHTML = `

      <img
        class="product-img"
        src="${escapeHtml(image)}"
        onerror="this.src='https://via.placeholder.com/100?text=Albaraka'"
      >

      <div class="product-info">

        <div class="product-name">
          ${escapeHtml(item.name)}
        </div>

        <div class="product-price">
          ${numberValue(item.price).toFixed(2)} ج.م
        </div>

        <span class="qty">
          الكمية: ${numberValue(item.quantity)}
        </span>

      </div>

      <strong>
        ${(
          numberValue(item.price) *
          numberValue(item.quantity)
        ).toFixed(2)} ج.م
      </strong>

    `;

    items.appendChild(row);

  });

  calculateTotals();
}


/* -----------------------------------------------------
   حماية النصوص
----------------------------------------------------- */

function escapeHtml(value) {

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


/* -----------------------------------------------------
   إنشاء رقم الطلب
----------------------------------------------------- */

function generateOrderNumber() {

  const now = new Date();

  const random =
    Math.floor(1000 + Math.random() * 9000);

  return (
    "BRK-" +
    now.getFullYear() +
    String(now.getMonth() + 1).padStart(2, "0") +
    String(now.getDate()).padStart(2, "0") +
    "-" +
    random
  );

}


/* -----------------------------------------------------
   إرسال الطلب
----------------------------------------------------- */

document
  .getElementById("orderForm")
  .addEventListener("submit", async function(e) {

    e.preventDefault();

    if (!cart.length) {

      showMessage(
        "السلة فارغة.",
        "error"
      );

      return;
    }

    const name =
      document.getElementById("customerName")
        .value.trim();

    const phone =
      document.getElementById("customerPhone")
        .value.trim();

    const address =
      document.getElementById("customerAddress")
        .value.trim();

    const city =
      document.getElementById("customerCity")
        .value.trim();

    const payment =
      document.getElementById("paymentMethod")
        .value;

    const notes =
      document.getElementById("notes")
        .value.trim();

    if (!name || !phone || !address) {

      showMessage(
        "من فضلك أكمل بيانات الطلب.",
        "error"
      );

      return;
    }

    const submitBtn =
      document.getElementById("submitBtn");

    submitBtn.disabled = true;
    submitBtn.textContent =
      "جاري إرسال الطلب...";

    const orderNumber =
      generateOrderNumber();

    const orderData = {

      id: null,

      order_number: orderNumber,

      customer_name: name,

      customer_phone: phone,

      customer_address: address,

      address: address,

      city: city,

      payment_method: payment,

      subtotal: subtotal,

      delivery_fee: deliveryFee,

      total: subtotal + deliveryFee,

      notes: notes,

      status: "pending",

      items: cart

    };


    /*
      المحاولة الأولى:
      إرسال الطلب إلى API الموجود في المشروع.
    */

    try {

      const response =
        await fetch("api/create-order.php", {

          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify(orderData)

        });


      if (response.ok) {

        let result = null;

        try {
          result = await response.json();
        } catch (_) {}

        finishOrder(
          orderNumber,
          result
        );

        return;
      }

    } catch (error) {

      console.log(
        "API غير متاح:",
        error
      );

    }


    /*
      إذا كان API غير موجود،
      نحفظ الطلب محلياً حتى لا تضيع بيانات العميل.
    */

    try {

      const oldOrders =
        JSON.parse(
          localStorage.getItem(
            "albaraka_orders"
          ) || "[]"
        );

      oldOrders.push(orderData);

      localStorage.setItem(
        "albaraka_orders",
        JSON.stringify(oldOrders)
      );

      finishOrder(orderNumber);

    } catch (error) {

      console.error(error);

      submitBtn.disabled = false;

      submitBtn.textContent =
        "تأكيد الطلب";

      showMessage(
        "حدث خطأ أثناء إرسال الطلب. حاول مرة أخرى.",
        "error"
      );

    }

  });


/* -----------------------------------------------------
   إنهاء الطلب
----------------------------------------------------- */

function finishOrder(orderNumber, result) {

  /*
    حذف السلة من كل المفاتيح المحتملة
  */

  const keys = [
    "cart",
    "cartItems",
    "shoppingCart",
    "albaraka_cart",
    "AlbarakaCart",
    "productsCart"
  ];

  keys.forEach(key => {

    try {
      localStorage.removeItem(key);
    } catch (_) {}

  });


  const content =
    document.getElementById(
      "checkoutContent"
    );

  content.innerHTML = `

    <div class="box empty"
         style="grid-column:1/-1;">

      <div class="empty-icon">✅</div>

      <h2>
        تم استلام طلبك بنجاح
      </h2>

      <div class="order-number">
        رقم الطلب: ${escapeHtml(orderNumber)}
      </div>

      <p>
        شكراً لتسوقك من مول البركة.
      </p>

      <p>
        سنتواصل معك لتأكيد الطلب والتوصيل.
      </p>

      <br>

      <a
        href="index.html"
        class="shop-btn"
      >
        العودة للرئيسية
      </a>

    </div>

  `;

}


/* -----------------------------------------------------
   الرسائل
----------------------------------------------------- */

function showMessage(text, type) {

  const message =
    document.getElementById("message");

  message.textContent = text;

  message.className =
    "message " + type;

}


/* -----------------------------------------------------
   تشغيل الصفحة
----------------------------------------------------- */

document.addEventListener(
  "DOMContentLoaded",
  function() {

    try {

      loadCart();

      renderCart();

    } catch (error) {

      console.error(error);

      document.getElementById(
        "loading"
      ).style.display = "none";

      document.getElementById(
        "emptyCart"
      ).style.display = "block";

    }

  }
);

</script>

</body>
  </html>
