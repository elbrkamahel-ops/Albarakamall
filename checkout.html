<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>إتمام الطلب | البركة مول</title>

    <link rel="stylesheet" href="style.css">

    <style>
        .checkout-page {
            padding: 35px 0 60px;
        }

        .checkout-layout {
            display: grid;
            grid-template-columns: 1fr 360px;
            gap: 22px;
            align-items: start;
        }

        .checkout-card,
        .order-summary {
            background: #fff;
            border: 1px solid #e7e7e7;
            border-radius: 14px;
            padding: 24px;
        }

        .checkout-card h1,
        .order-summary h2 {
            margin-bottom: 22px;
        }

        .form-section {
            margin-bottom: 28px;
        }

        .form-section h2 {
            font-size: 18px;
            margin-bottom: 15px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 14px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group.full {
            grid-column: 1 / -1;
        }

        .form-group label {
            font-size: 13px;
            font-weight: bold;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            min-height: 45px;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 10px 12px;
            outline: none;
            font-family: inherit;
        }

        .form-group textarea {
            min-height: 90px;
            resize: vertical;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            border-color: #00843d;
        }

        .payment-options {
            display: grid;
            gap: 10px;
        }

        .payment-option {
            display: flex;
            align-items: center;
            gap: 12px;
            border: 1px solid #ddd;
            border-radius: 9px;
            padding: 14px;
            cursor: pointer;
        }

        .payment-option input {
            accent-color: #00843d;
        }

        .payment-option.selected {
            border-color: #00843d;
            background: #f0faf4;
        }

        .payment-icon {
            font-size: 25px;
        }

        .payment-text strong,
        .payment-text span {
            display: block;
        }

        .payment-text span {
            color: #777;
            font-size: 11px;
        }

        .order-summary {
            position: sticky;
            top: 120px;
        }

        .order-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 0;
            border-bottom: 1px solid #eee;
        }

        .order-item-image {
            width: 50px;
            height: 50px;
            display: grid;
            place-items: center;
            background: #f2f7f3;
            border-radius: 8px;
            font-size: 28px;
        }

        .order-item-info {
            flex: 1;
        }

        .order-item-info strong {
            display: block;
            font-size: 12px;
        }

        .order-item-info span {
            color: #777;
            font-size: 11px;
        }

        .order-item-price {
            color: #00843d;
            font-size: 12px;
            font-weight: bold;
        }

        .checkout-total {
            margin-top: 18px;
            border-top: 1px solid #eee;
            padding-top: 15px;
        }

        .total-row {
            display: flex;
            justify-content: space-between;
            padding: 7px 0;
            font-size: 13px;
        }

        .total-row.final {
            font-size: 19px;
            font-weight: bold;
            margin-top: 8px;
        }

        .total-row.final strong {
            color: #00843d;
        }

        .place-order {
            width: 100%;
            min-height: 52px;
            border: 0;
            border-radius: 8px;
            background: #00843d;
            color: #fff;
            font-weight: bold;
            font-size: 15px;
            margin-top: 18px;
            cursor: pointer;
        }

        .place-order:hover {
            background: #006b31;
        }

        .secure-note {
            text-align: center;
            color: #777;
            font-size: 11px;
            margin-top: 12px;
        }

        .empty-checkout {
            text-align: center;
            background: #fff;
            border: 1px solid #eee;
            border-radius: 14px;
            padding: 60px 20px;
        }

        .empty-checkout-icon {
            font-size: 60px;
        }

        .empty-checkout a {
            display: inline-block;
            margin-top: 18px;
            background: #00843d;
            color: #fff;
            padding: 11px 22px;
            border-radius: 8px;
        }

        .success-icon {
            font-size: 70px;
            margin-bottom: 15px;
        }

        .order-number {
            display: inline-block;
            background: #f0faf4;
            color: #00843d;
            padding: 10px 18px;
            border-radius: 8px;
            margin: 10px 0;
            font-weight: bold;
        }

        @media (max-width: 800px) {
            .checkout-layout {
                grid-template-columns: 1fr;
            }

            .order-summary {
                position: static;
            }
        }

        @media (max-width: 600px) {
            .checkout-page {
                padding: 20px 0 40px;
            }

            .checkout-card,
            .order-summary {
                padding: 16px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .form-group.full {
                grid-column: auto;
            }
        }
    </style>
</head>
