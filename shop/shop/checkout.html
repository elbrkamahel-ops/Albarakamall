<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>إتمام الطلب | مول البركة</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Tahoma,Arial,sans-serif;
    background:#f5f7f5;
    color:#172019;
}

button,
input,
textarea,
select{
    font-family:inherit;
}

button{
    cursor:pointer;
}

.header{
    background:#087f3d;
    color:#fff;
    padding:16px;
    box-shadow:0 2px 10px #0002;
}

.header-inner{
    max-width:1100px;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
}

.logo{
    font-size:23px;
    font-weight:bold;
}

.back{
    color:#fff;
    text-decoration:none;
    background:#ffffff22;
    padding:9px 15px;
    border-radius:10px;
}

.container{
    max-width:1100px;
    margin:25px auto;
    padding:0 15px;
}

.title{
    margin-bottom:20px;
}

.title h1{
    font-size:27px;
    margin-bottom:5px;
}

.title p{
    color:#69736c;
}

.layout{
    display:grid;
    grid-template-columns:1fr 380px;
    gap:20px;
}

.box{
    background:#fff;
    border-radius:17px;
    padding:22px;
    box-shadow:0 2px 12px #00000008;
    border:1px solid #e3e8e4;
}

.box h2{
    font-size:20px;
    margin-bottom:18px;
    color:#087f3d;
}

.form-group{
    margin-bottom:15px;
}

.form-group label{
    display:block;
    margin-bottom:6px;
    font-weight:bold;
}

.form-group input,
.form-group textarea,
.form-group select{
    width:100%;
    border:1px solid #d9dfda;
    border-radius:10px;
    padding:12px;
    outline:none;
    background:#fff;
}

.form-group input:focus,
.form-group textarea:focus,
.form-group select:focus{
    border-color:#087f3d;
}

.form-group textarea{
    min-height:100px;
    resize:vertical;
}

.required{
    color:#d92828;
}

.payment{
    display:grid;
    gap:10px;
}

.payment label{
    display:flex;
    align-items:center;
    gap:8px;
    border:1px solid #dfe5e0;
    padding:12px;
    border-radius:10px;
    cursor:pointer;
}

.payment label:hover{
    border-color:#087f3d;
}

.order-item{
    display:grid;
    grid-template-columns:50px 1fr auto;
    gap:10px;
    align-items:center;
    padding:12px 0;
    border-bottom:1px solid #edf0ed;
}

.item-image{
    width:50px;
    height:50px;
    border-radius:10px;
    background:#eef5ef;
    display:grid;
    place-items:center;
    font-size:27px;
}

.item-name{
    font-weight:bold;
}

.item-qty{
    color:#68736c;
    font-size:13px;
}

.item-price{
    color:#087f3d;
    font-weight:bold;
}

.summary{
    margin-top:15px;
}

.summary-row{
    display:flex;
    justify-content:space-between;
    padding:8px 0;
}

.summary-row.total{
    border-top:1px solid #e1e6e2;
    margin-top:8px;
    padding-top:15px;
    font-size:21px;
    font-weight:bold;
    color:#087f3d;
}

.submit{
    width:100%;
    margin-top:18px;
    padding:14px;
    background:#087f3d;
    color:#fff;
    border:0;
    border-radius:12px;
    font-size:17px;
    font-weight:bold;
}

.submit:hover{
    background:#0a9a4b;
}

.empty{
    text-align:center;
    padding:40px 15px;
}

.empty-icon{
    font-size:55px;
    margin-bottom:10px;
}

.empty a{
    display:inline-block;
    margin-top:15px;
    background:#087f3d;
    color:#fff;
    padding:11px 20px;
    border-radius:10px;
    text-decoration:none;
}

.message{
    display:none;
    padding:15px;
    margin-top:15px;
    border-radius:10px;
    text-align:center;
}

.success{
    background:#e7f7ed;
    color:#087f3d;
}

.error{
    background:#fdeaea;
    color:#c52222;
}

@media(max-width:800px){

    .layout{
        grid-template-columns:1fr;
    }

    .header-inner{
        flex-direction:column;
    }

    .logo{
        font-size:20px;
    }

}

</style>
</head>

<body>

<header class="header">

    <div class="header-inner">

        <div class="logo">
            🛒 مول البركة
        </div>

        <a class="back" href="index.php">
            ← العودة للمتجر
        </a>

    </div>

</header>


<main class="container">

    <div class="title">

        <h1>
            إتمام الطلب
        </h1>

        <p>
            أدخل بياناتك لإتمام طلبك من مول البركة
        </p>

    </div>


    <div id="emptyCart" class="box empty" style="display:none">

        <div class="empty-icon">
            🛒
        </div>

        <h2>
            السلة فارغة
        </h2>

        <p>
            أضف منتجات إلى السلة أولاً.
        </p>

        <a href="index.php">
            العودة للتسوق
        </a>

    </div>


    <div id="checkoutArea" class="layout">


        <!-- بيانات العميل -->

        <section class="box">

            <h2>
                بيانات العميل
            </h2>


            <form id="orderForm">


                <div class="form-group">

                    <label>
                        الاسم الكامل
                        <span class="required">*</span>
                    </label>

                    <input
                        type="text"
                        id="customerName"
                        placeholder="اكتب اسمك بالكامل"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>
                        رقم الهاتف
                        <span class="required">*</span>
                    </label>

                    <input
                        type="tel"
                        id="customerPhone"
                        placeholder="مثال: 01119511185"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>
                        العنوان
                        <span class="required">*</span>
                    </label>

                    <textarea
                        id="customerAddress"
                        placeholder="اكتب عنوان التوصيل بالتفصيل"
                        required
                    ></textarea>

                </div>


                <div class="form-group">

                    <label>
                        ملاحظات الطلب
                    </label>

                    <textarea
                        id="customerNotes"
                        placeholder="أي ملاحظات خاصة بالطلب"
                    ></textarea>

                </div>


                <div class="form-group">

                    <label>
                        طريقة الدفع
                    </label>

                    <div class="payment">

                        <label>

                            <input
                                type="radio"
                                name="payment"
                                value="الدفع عند الاستلام"
                                checked
                            >

                            💵 الدفع عند الاستلام

                        </label>


                        <label>

                            <input
                                type="radio"
                                name="payment"
                                value="دفع إلكتروني"
                            >

                            💳 دفع إلكتروني

                        </label>

                    </div>

                </div>


                <button
                    class="submit"
                    type="submit"
                >

                    تأكيد الطلب 🛍️

                </button>


                <div
                    id="successMessage"
                    class="message success"
                ></div>


                <div
                    id="errorMessage"
                    class="message error"
                ></div>


            </form>

        </section>



        <!-- ملخص الطلب -->

        <section class="box">

            <h2>
                ملخص الطلب
            </h2>


            <div id="orderItems"></div>


            <div class="summary">

                <div class="summary-row">

                    <span>
                        عدد المنتجات
                    </span>

                    <strong id="itemsCount">
                        0
                    </strong>

                </div>


                <div class="summary-row">

                    <span>
                        تكلفة التوصيل
                    </span>

                    <strong>
                        حسب العنوان
                    </strong>

                </div>


                <div class="summary-row total">

                    <span>
                        الإجمالي
                    </span>

                    <span id="orderTotal">
                        0 ج.م
                    </span>

                </div>

            </div>

        </section>


    </div>

</main>



<script>


/*
    المنتجات الموجودة في المتجر
*/

const PRODUCTS = [

    {
        id:1,
        name:'طماطم بلدي',
        price:18,
        unit:'كجم',
        emoji:'🍅'
    },

    {
        id:2,
        name:'بطاطس',
        price:22,
        unit:'كجم',
        emoji:'🥔'
    },

    {
        id:3,
        name:'خيار',
        price:25,
        unit:'كجم',
        emoji:'🥒'
    },

    {
        id:4,
        name:'فلفل أخضر',
        price:35,
        unit:'كجم',
        emoji:'🫑'
    },

    {
        id:5,
        name:'موز',
        price:30,
        unit:'كجم',
        emoji:'🍌'
    },

    {
        id:6,
        name:'تفاح',
        price:55,
        unit:'كجم',
        emoji:'🍎'
    },

    {
        id:7,
        name:'برتقال',
        price:32,
        unit:'كجم',
        emoji:'🍊'
    },

    {
        id:8,
        name:'فراولة',
        price:65,
        unit:'كجم',
        emoji:'🍓'
    },

    {
        id:9,
        name:'صدور فراخ',
        price:145,
        unit:'كجم',
        emoji:'🍗'
    },

    {
        id:10,
        name:'فراخ كاملة',
        price:125,
        unit:'كجم',
        emoji:'🐔'
    },

    {
        id:11,
        name:'لحم بقري',
        price:420,
        unit:'كجم',
        emoji:'🥩'
    },

    {
        id:12,
        name:'لحم مفروم',
        price:390,
        unit:'كجم',
        emoji:'🥩'
    },

    {
        id:13,
        name:'أرز',
        price:35,
        unit:'كجم',
        emoji:'🍚'
    },

    {
        id:14,
        name:'سكر',
        price:30,
        unit:'كجم',
        emoji:'🧂'
    },

    {
        id:15,
        name:'زيت طعام',
        price:75,
        unit:'زجاجة',
        emoji:'🫗'
    },

    {
        id:16,
        name:'بيض',
        price:85,
        unit:'طبق',
        emoji:'🥚'
    }

];



/*
    قراءة السلة
*/

let cart = {};

try {

    cart = JSON.parse(
        localStorage.getItem('albaraka_cart') || '{}'
    );

} catch(error) {

    cart = {};

}



if(
    !cart ||
    typeof cart !== 'object'
){

    cart = {};

}



/*
    تحويل السعر
*/

function money(number){

    return Number(number).toLocaleString('ar-EG') + ' ج.م';

}



/*
    عرض السلة
*/

function renderOrder(){

    const itemsContainer =
        document.getElementById('orderItems');

    const empty =
        document.getElementById('emptyCart');

    const checkout =
        document.getElementById('checkoutArea');


    let total = 0;

    let count = 0;

    let html = '';


    Object.keys(cart).forEach(function(id){

        const quantity =
            Number(cart[id]);


        if(quantity <= 0){

            return;

        }


        const product =
            PRODUCTS.find(function(item){

                return String(item.id) === String(id);

            });


        if(!product){

            return;

        }


        const subtotal =
            product.price * quantity;


        total += subtotal;

        count += quantity;


        html += `

            <div class="order-item">

                <div class="item-image">
                    ${product.emoji}
                </div>

                <div>

                    <div class="item-name">
                        ${product.name}
                    </div>

                    <div class="item-qty">
                        الكمية: ${quantity}
                    </div>

                </div>

                <div class="item-price">
                    ${money(subtotal)}
                </div>

            </div>

        `;

    });


    if(count === 0){

        empty.style.display = 'block';

        checkout.style.display = 'none';

        return;

    }


    empty.style.display = 'none';

    checkout.style.display = 'grid';


    itemsContainer.innerHTML = html;


    document.getElementById('itemsCount').textContent =
        count;


    document.getElementById('orderTotal').textContent =
        money(total);

}



/*
    إرسال الطلب
*/

document
.getElementById('orderForm')
.addEventListener('submit',function(event){

    event.preventDefault();


    const name =
        document.getElementById('customerName')
        .value.trim();


    const phone =
        document.getElementById('customerPhone')
        .value.trim();


    const address =
        document.getElementById('customerAddress')
        .value.trim();


    const notes =
        document.getElementById('customerNotes')
        .value.trim();


    const payment =
        document.querySelector(
            'input[name="payment"]:checked'
        ).value;


    const success =
        document.getElementById('successMessage');


    const error =
        document.getElementById('errorMessage');


    success.style.display = 'none';

    error.style.display = 'none';


    if(!name || !phone || !address){

        error.textContent =
            'من فضلك أكمل الاسم ورقم الهاتف والعنوان.';

        error.style.display = 'block';

        return;

    }


    let items = [];

    let total = 0;


    Object.keys(cart).forEach(function(id){

        const quantity =
            Number(cart[id]);


        const product =
            PRODUCTS.find(function(item){

                return String(item.id) === String(id);

            });


        if(product && quantity > 0){

            items.push({

                id:product.id,

                name:product.name,

                price:product.price,

                quantity:quantity

            });


            total +=
                product.price * quantity;

        }

    });


    if(items.length === 0){

        error.textContent =
            'السلة فارغة.';

        error.style.display = 'block';

        return;

    }


    /*
        حفظ بيانات الطلب مؤقتًا
        لحين ربط قاعدة البيانات
    */

    const order = {

        orderNumber:
            'BRK-' +
            Date.now(),

        customerName:name,

        phone:phone,

        address:address,

        notes:notes,

        payment:payment,

        items:items,

        total:total,

        createdAt:
            new Date().toISOString()

    };


    localStorage.setItem(
        'albaraka_last_order',
        JSON.stringify(order)
    );


    /*
        إظهار نجاح الطلب
    */

    success.innerHTML =

        '✅ تم تجهيز طلبك بنجاح!<br>' +

        'رقم الطلب: <strong>' +

        order.orderNumber +

        '</strong><br><br>' +

        'سيتم ربط إرسال الطلب بقاعدة البيانات ولوحة التحكم في الخطوة التالية.';


    success.style.display = 'block';


    /*
        تفريغ السلة
    */

    localStorage.removeItem(
        'albaraka_cart'
    );


    cart = {};


    renderOrder();


    window.scrollTo({

        top:0,

        behavior:'smooth'

    });

});



/*
    تشغيل الصفحة
*/

renderOrder();

</script>

</body>
  </html>
